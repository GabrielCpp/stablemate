qa-stack:
  description: >-
    Seed a declarative QA stack manifest (qa-stack.yml) the coder workflow's ensure_stack
    step brings up outside any agent turn. Fill in the repo's own bring-up/seed/health
    commands; see docs/qa-stack-manifest.md.
  tree:
    qa-stack.yml: |
      # QA stack manifest — the coder workflow's `ensure_stack` step runs this to stand the
      # heavyweight QA stack up (compose/emulators/DB + baseline seed) OUTSIDE any agent turn,
      # so node teardown cannot kill it mid-build. Fill in your repo's documented commands.
      # Full contract: docs/qa-stack-manifest.md. Delete the keys you do not need.
      #
      # A foreground service scoped to the QA run (a dev server pinned to branch source) does
      # NOT belong here — declare it in the QA plan's `background:` block, owned by ostler.

      # The readiness probe: base URL + path the stack answers when it is up.
      entry_url: http://localhost:8080
      health_path: /            # e.g. /healthz — a real readiness route, not a page served with the backend down

      # Working directory for `launch` and steps, relative to the repo root.
      app_cwd: .

      # Seconds to wait for the stack to answer the probe. A cold image build is minutes.
      boot_timeout: 300

      # A marker string in the served body: the readiness signal, and a precondition for reuse.
      # identity: my-service

      # When a stack already serving may be ADOPTED instead of brought up again. A container
      # built from the code under test goes stale the moment a story changes that code, so
      # adoption is earned, never automatic:
      #   if-fresh  (default)  adopt only if a `fresh` probe passes; else re-launch (rebuild).
      #                        With no `fresh` probe it NEVER adopts — safe for any code stack.
      #   always               adopt whenever serving. ONLY for a code-INDEPENDENT stack
      #                        (a stock DB/emulator with fixtures) whose build ignores your code.
      #   never                always re-launch.
      # reuse: if-fresh
      # fresh: "TODO: make stack-matches-head   # exit 0 iff running images built from current source"

      # The bring-up command. Must be IDEMPOTENT and SELF-FRESHENING — it re-runs whenever the
      # stack is not adopted, so it must rebuild changed images (a cache-hit no-op otherwise).
      # A bring-up command exits 0 once the stack serves in containers it does not own. A raw
      # foreground dev server does NOT go here — put it in the QA plan's `background:` block.
      launch: "TODO: docker compose up -d --build   # or: make dev-stack"

      # Teardown recipe. OMIT to leave an expensive shared stack up between stories (the default).
      # stop: "TODO: make dev-stack-down"

      # Ordered blocking steps run BEFORE launch (deps, build, migrations). Optional.
      # prepare:
      #   - "TODO: make deps"

      # Ordered IDEMPOTENT steps run AFTER the stack serves (baseline fixtures, the sign-in
      # test user in the Auth emulator). Optional. A step may be a bare string or a mapping
      # with `run`, `working-directory` (relative to repo root), and `timeout` (seconds).
      # seed:
      #   - "TODO: make seed"

      # Ordered command gates run last; each must exit 0. Optional.
      # health:
      #   - "TODO: make stack-health"
