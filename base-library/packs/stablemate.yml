description: >
  Stablemate toolchain skills. For workhorse: writing workflow
  nodes, writing the prompt a turn dispatches, writing the milestone folder the Author
  workflow consumes, and operating a live run (find it through groom, then reload,
  switch or answer it). For farrier: setup, library maintenance, and how to write
  a document an agent reads. For ostler: the planning-graph CLI and Python API, the executable service book for HTTP and gRPC services,
  and how to write a repo's README and CLAUDE.md. For groom:
  the operator-gate dashboard and the telemetry store behind it. For saddlebag:
  signing in and running commands with secrets the agent never sees. For paddock:
  writing, running and reading benchmarks of a workflow. Four commands run the
  coder and okf-book flows by hand: story-spec-dev, story-book-qa, book-write and
  book-catch-up.
# The `stablemate/` segment is the library namespace and is stripped from the
# installed name; the skill names themselves no longer repeat it. Each one says
# which tool it is about — `ostler`, `groom`, `farrier-setup`,
# `workhorse-engine`. The installed name already
# carries the consuming repo's prefix, so `stablemate-ostler` named this repo
# twice, and every other repo got `<repo>-stablemate-ostler` — a name that reads
# as "about stablemate" when the skill is about ostler.
skills:
  - farrier/*
  - groom/*
  - ostler/*
  - paddock/*
  - saddlebag/*
  - workhorse/*
prompts:
  - story/*
  - book/*
