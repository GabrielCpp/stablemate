description: >
  Stablemate toolchain skills — workhorse workflow authoring, the one-roadmap-to-one-milestone contract consumed by Author, farrier install/setup, the ostler doc-graph CLI and, as its own skill, the OKF format it enforces (node types, bullet grammar, the check vocabulary and the modeling playbooks), groom's operator-gate dashboard plus the telemetry/transcript store behind it, the parse-don't-match standard for reading structured formats, the portability tiers a shipped package owes its users, the writing doctrine every document an agent reads is held to, and the vertical-slicing doctrine (tracer-bullet stories) the author workflow's planning queries load. Plus the diagnosis discipline a hard bug is held to (a loop that goes red before any hypothesis) and the five commands: `grill` (interview a design until its frontier is empty), `brainstorm` (diverge into a wide field of options, then converge to a ranked shortlist) `babysit-run` (watch a run's outbox/inbox from this session; on a failure, diagnose, fix stablemate, reload and resume) and the two `implement-plan` variants — `implement-plan-worktree` (cut a worktree under the configured `worktree_dir`, branch there and build it) and `implement-plan-here` (build it on the branch already checked out, in a tree that may not be yours alone). (The stablemate repo itself additionally selects the UI a11y skills for groom's UI directly in its agents.yml.)
# The `stablemate/` segment is the library namespace and is stripped from the
# installed name; the skill names themselves no longer repeat it. Each one says
# which tool it is about — `ostler`, `groom`, `farrier-setup`,
# `workhorse-scripting` — or says nothing when the rule is generic to any repo
# (`code-review`). The installed name already
# carries the consuming repo's prefix, so `stablemate-ostler` named this repo
# twice, and every other repo got `<repo>-stablemate-ostler` — a name that reads
# as "about stablemate" when the skill is about ostler.
skills:
  - farrier/*
  - groom/*
  - ostler/*
  - workhorse/*

# These are *procedures*, so they ship as commands rather than as skills: a skill
# is loaded when its scope matches, and the moment a change is finished never
# matched anything.
#
# The commit cadence is no longer among them. Every change ends there, so every
# repo that had it aggregated it into its root instructions — and once the text is
# resident every turn, nothing ever invokes it by name and the command is a second
# copy of what is already on screen. It is the `commit-and-push` policy now
# (`localInstructions: policies:`), templated for the repo's scope vocabulary and
# gate. Reloading a live run that holds the code you just fixed is not a command
# either: it is a branch of *writing workflow code*, so it lives in the
# `workhorse-scripting` skill, which loads exactly when that code is being edited.
prompts:
  - stablemate/babysit-run
