[pytest]
testpaths = tests

# Autoclean. Each test builds a whole sandbox repo (an OKF graph, epics, stories, a git
# repo) under tmp_path. pytest's default (`all`) keeps every one of those for the three
# most recent runs, so a suite that passes still accumulates on disk indefinitely. Keep a
# sandbox only when it can still be read for a reason: a failing test.
tmp_path_retention_policy = failed
