[project]
name = "workhorse-workflows"
version = "0.2.0"
description = "The stablemate agent workflows — hello-world, research, author, coder, okf-builder — as an installable package workhorse discovers by entry point."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Côté" }]
keywords = ["agent", "workflow", "claude", "llm", "automation", "orchestration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = [
  # The engine. This package is the only direction the dependency runs: workhorse
  # knows nothing about any workflow in here, and must not. Workflows 1.x starts on
  # the Workhorse 2.x backend contract: that coordinated release replaces Aider with
  # Cline and carries the breaking recovery semantics these machines are tested on.
  "workhorse-agent>=2,<3",
  # `kit` — the git/GitHub/workspace half of what used to be `workhorse.scriptutil`.
  # These are here rather than on the engine because knowing how to open a pull
  # request is workflow domain: workhorse never called either library, and every
  # install of it paid for both.
  "gitpython>=3.1",
  "PyGithub>=2.0",
  # The surveyor's enumeration rules, its finding-record front matter and its cluster
  # partition are all YAML the nodes read directly. Declared here rather than leaned on
  # through workhorse's own dependency: a module that imports it says so.
  "pyyaml>=6.0",
  # Workflow-side tools each land with the first workflow that imports one — a
  # dependency nothing imports is a claim the lockfile cannot check. `ostler` arrived
  # with the author port: its epic/story/coverage nodes read and write the planning-doc
  # graph through the library, and `verify_integrity` runs `ostler doctor` over it. The
  # 1.x floor is the coordinated release that added nested backlog adoption; cap the
  # major because that planning-graph API is part of the workflow's runtime contract.
  # The release wheel smoke test installs sibling candidates without workspace sources,
  # which is the only place this cross-package constraint is actually exercised.
  "ostler>=1,<2",
  # A unified diff is a format with a grammar, and the coder's hygiene gate reads one to
  # find the lines a branch added. Hand-scanning it means every `startswith("+++ b/")`
  # test is a guess that the line is a header rather than a hunk body that looks like one.
  "unidiff>=0.7",
  # Genesis merges a service into a repo's existing `agents.yml`, and that file is
  # hand-written and commented. A round-trip loader is the whole requirement: pyyaml
  # would round-trip it into a comment-free re-serialization, which is a config file
  # the operator no longer recognizes as theirs.
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

# One console script per workflow — the ONLY way a workflow is reached. Each points at
# the callable `console_script(workflow.entry_point(Entry))` RETURNS; `[project.scripts]`
# targets are called after import, so a module-level `main = console_script(...)` is the
# shape, and `console_script(...)()` is not.
#
# There is no `workhorse.workflows` entry-point group and no `workhorse run <name>`:
# workhorse is a library that resolves no workflow by name, so a script carries the
# `Registry` it runs instead of naming one for something else to look up. That makes this
# table the single source of truth — a workflow with no row here has no command at all,
# which is a gap you notice at install time rather than at resolution time.
#
# `hello-world` is deliberately first: it is the one a reader runs before they trust any
# of the others, and it needs no repo, no manifest and — under `--dry-run` — no agent CLI.
#
#     workhorse-hello-world run --dry-run
#     workhorse-coder run qa --params '{"story":"CASE-1234"}'
[project.scripts]
workhorse-hello-world = "workhorse_workflows.hello_world.workflow:main"
workhorse-research = "workhorse_workflows.research.workflow:main"
workhorse-author = "workhorse_workflows.author.workflow:main"
workhorse-okf-builder = "workhorse_workflows.okf_builder.workflow:main"
workhorse-coder = "workhorse_workflows.coder.workflow:main"

[project.urls]
Homepage = "https://github.com/GabrielCpp/stablemate/tree/main/workflows"
Repository = "https://github.com/GabrielCpp/stablemate"
Issues = "https://github.com/GabrielCpp/stablemate/issues"

[tool.uv.sources]
workhorse-agent = { workspace = true }
ostler = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src/ layout, and the wheel must install unpacked: workhorse renders a workflow's
# prompts with a filesystem template loader rooted at the package directory, so a
# zip-imported install is refused at resolution (workhorse/packaged.py).
[tool.hatch.build.targets.wheel]
packages = ["src/workhorse_workflows"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/` on the import path, so `from _fakes import StubRunner` resolves from every
# suite. Stated rather than inherited: the nested suites are packages (`tests/coder/`
# has an `__init__.py`), so what pytest prepends for them is `tests/` — but only once
# something has been collected from there, which makes an implicit version of this
# depend on collection order.
pythonpath = ["tests"]
tmp_path_retention_policy = "failed"
