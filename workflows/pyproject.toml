[project]
name = "workhorse-workflows"
version = "0.1.0"
description = "The stablemate agent workflows — research, author, coder, okf-builder — as an installable package workhorse discovers by entry point."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Côté" }]
keywords = ["agent", "workflow", "claude", "llm", "automation", "orchestration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = [
  # The engine. This package is the only direction the dependency runs: workhorse
  # knows nothing about any workflow in here, and must not.
  "workhorse-agent>=0.8,<1",
  # `kit` — the git/GitHub/workspace half of what used to be `workhorse.scriptutil`.
  # These are here rather than on the engine because knowing how to open a pull
  # request is workflow domain: workhorse never called either library, and every
  # install of it paid for both.
  "gitpython>=3.1",
  "PyGithub>=2.0",
  # The surveyor's enumeration rules, its finding-record front matter and its cluster
  # partition are all YAML the nodes read directly. Declared here rather than leaned on
  # through workhorse's own dependency: a module that imports it says so.
  "pyyaml>=6.0",
  # Workflow-side tools each land with the first workflow that imports one — a
  # dependency nothing imports is a claim the lockfile cannot check. `ostler` arrived
  # with the author port: its epic/story/coverage nodes read and write the planning-doc
  # graph through the library, and `verify_integrity` runs `ostler doctor` over it. The
  # `vet` extra stays out until the coder port's screenshot steps import it.
  "ostler>=0.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

# Discovery: `workhorse run <name>` resolves a name here before it looks in a library
# directory. The value points at the `Registry` OBJECT, not the entry function —
# discovery needs the registry.
#
# A name declared here SHADOWS the base library's copy of the same workflow, which is
# the intent: `base-library/workflows/research/` stays as the YAML original (still
# runnable by path) and this is what `workhorse run research` gets.
[project.entry-points."workhorse.workflows"]
research = "workhorse_workflows.research.workflow:workflow"
author = "workhorse_workflows.author.workflow:workflow"
okf-builder = "workhorse_workflows.okf_builder.workflow:workflow"

# One console script per workflow, pointing at the callable `workflow.main(Entry)`
# RETURNS. `[project.scripts]` targets are called after import, so a module-level
# `main = workflow.main(Research)` is the shape; `workflow.main(Research)()` is not.
#
# Both front doors run the same parser with the name bound differently:
#     workhorse         run research --run-id=… --params …
#     workhorse-research run          --run-id=… --params …
[project.scripts]
workhorse-research = "workhorse_workflows.research.workflow:main"
workhorse-author = "workhorse_workflows.author.workflow:main"
workhorse-okf-builder = "workhorse_workflows.okf_builder.workflow:main"

[project.urls]
Homepage = "https://github.com/GabrielCpp/stablemate/tree/main/workflows"
Repository = "https://github.com/GabrielCpp/stablemate"
Issues = "https://github.com/GabrielCpp/stablemate/issues"

[tool.uv.sources]
workhorse-agent = { workspace = true }
ostler = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src/ layout, and the wheel must install unpacked: workhorse renders a workflow's
# prompts with a filesystem template loader rooted at the package directory, so a
# zip-imported install is refused at resolution (workhorse/packaged.py).
[tool.hatch.build.targets.wheel]
packages = ["src/workhorse_workflows"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_policy = "failed"
