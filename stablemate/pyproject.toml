[project]
name = "stablemate"
version = "0.1.0"
description = "One install for the stablemate agent tools: the workhorse workflows, farrier and groom, at versions that work together."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Côté" }]
keywords = ["agent", "workflow", "claude", "llm", "automation", "dashboard"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = [
  "workhorse-workflows>=2,<3",
  "farrier>=3,<4",
  "stablemate-groom>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "packaging>=24"]

[project.urls]
Homepage = "https://github.com/GabrielCpp/stablemate"
Repository = "https://github.com/GabrielCpp/stablemate"
Issues = "https://github.com/GabrielCpp/stablemate/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["README.md", "LICENSE"]

[tool.uv.sources]
workhorse-workflows = { workspace = true }
farrier = { workspace = true }
stablemate-groom = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "error",
]
