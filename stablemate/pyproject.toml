[project]
name = "stablemate"
version = "0.1.1"
description = "One install for the stablemate agent tools: the workhorse workflows, farrier, groom, ostler and saddlebag, at versions that work together."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Côté" }]
keywords = ["agent", "workflow", "claude", "llm", "automation", "dashboard"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = [
  "workhorse-workflows>=4,<5",
  "farrier>=4,<5",
  "stablemate-groom>=2,<3",
  "ostler>=4,<5",
  "stablemate-saddlebag>=2,<3",
]

[project.scripts]
farrier = "farrier.install:main"
groom = "groom.cli:main"
groom-sidecar = "groom.cli:sidecar_main"
ostler = "ostler.cli:main"
saddlebag = "saddlebag.cli:main"
workhorse-loop-runner = "workhorse_workflows.loop_runner.workflow:main"
workhorse-research = "workhorse_workflows.research.workflow:main"
workhorse-author = "workhorse_workflows.author.workflow:main"
workhorse-coder = "workhorse_workflows.coder.workflow:main"
workhorse-okf-book = "workhorse_workflows.okf_book.workflow:main"
workhorse-new = "workhorse_workflows.new.scaffold:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "packaging>=24"]

[project.urls]
Homepage = "https://github.com/GabrielCpp/stablemate"
Repository = "https://github.com/GabrielCpp/stablemate"
Issues = "https://github.com/GabrielCpp/stablemate/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["README.md", "LICENSE"]

[tool.uv.sources]
workhorse-workflows = { workspace = true }
farrier = { workspace = true }
stablemate-groom = { workspace = true }
ostler = { workspace = true }
stablemate-saddlebag = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "error",
]
