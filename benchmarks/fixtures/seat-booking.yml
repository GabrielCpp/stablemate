# The seat-booking replay fixture: the frozen app tracked in this repo.
#
# The other fixture form (`source:` + a bundle) freezes an app that was *built* by a run,
# which can measure convergence and nothing else — its book is whatever the run produced,
# so agreeing with it proves only that QA agrees with itself. This one points at a
# hand-written app with a documented answer key, which is what makes detection scorable.
#
# `app:` is relative to the repo root and the tree is tracked, so the fixture travels with
# a clone and `check_public.py` can read every byte of it. There is no bundle and nothing
# to `capture`: each story's git state is materialized from its own pre-images, because QA
# mints obligations from uncommitted changes and a finished tree has none.
#
# No per-story commits either — `stories:` here is just the replay order, which is also the
# dependency order (`confirm-booking` is blocked by `seat-hold`).

name: seat-booking
app: benchmarks/apps/seat-booking

stories:
  - story: seat-map
  - story: seat-hold
  - story: confirm-booking
