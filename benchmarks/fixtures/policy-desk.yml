# The policy-desk replay fixture: the second frozen app tracked in this repo.
#
# `seat-booking` is one Python service with one screen; this one is a Go API behind a React
# SPA, which is the shape most QA leverage questions only arise in — a deep link that has to
# survive a page load, a route change the client owns, an obligation that spans two services.
# Both fixtures are hand-written with a documented answer key, which is what makes detection
# scorable at all; what this one adds is the interest cases the small app cannot pose.
#
# `app:` is relative to the repo root and the tree is tracked, so the fixture travels with
# a clone and `check_public.py` can read every byte of it. There is no bundle and nothing
# to `capture`: each story's git state is materialized from its own pre-images, because QA
# mints obligations from uncommitted changes and a finished tree has none.
#
# `stories:` is the replay order, which is also the dependency order: the write path first,
# because the register has nothing to list and an amendment has nothing to amend until a
# policy can be put on file.

name: policy-desk
app: benchmarks/apps/policy-desk

stories:
  - story: create-policy
  - story: policy-list
  - story: edit-policy
