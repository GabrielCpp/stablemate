# The cross-surface task: a Go API and a React Router web app, four bullets, an hour.
#
# One surface can never fail the way two surfaces fail. A story that spans stacks is
# where the coder's plan-context has to name more than one layer, where farrier has to
# resolve a second pack's skills, and where a prompt template renders per-stack guidance
# it never renders in a single-stack run — three mechanisms with no coverage at all in
# `link-shortener` or `expense-split`, however many times those are run.
#
# Four bullets rather than five: the second surface roughly doubles the work per bullet,
# and the hour is the constraint that makes this spec usable.

target: /tmp/bench-bookmarks
backlog: docs/backlog.md

# See link-shortener/bench.yml.
power:
  low: {claude: {model: sonnet, effort: low}}
  medium: {claude: {model: sonnet, effort: low}}
  high: {claude: {model: sonnet, effort: low}}

# Genesis gets more room than the single-surface specs: `npm create react-router` fetches
# a package tree, which is network-bound and the slowest step in the chain.
budget:
  genesis: 1200
  author: 900
  coder: 2700

# API-side gates only. The web build would need an `npm install` that costs more wall
# clock than the checks are worth, and checks never feed the score — they exist to
# contradict a judge that scored a bullet `verified`, which the Go side can already do.
checks:
  - name: build
    cmd: cd api && go build ./...
    timeout: 300
  - name: test
    cmd: cd api && go test ./...
    timeout: 600

judge: {}

repo:
  docs_scaffold: shared-docs:docs
  packs: product-planning

surfaces:
  - service: api
    service_root: api
    packs: go
    scaffolds: go-service:api
    init_cmd: go mod init example.com/bookmarks/api
    marker: go.mod
    markers: go.mod,main.go

  - service: web
    service_root: web
    packs: react-router
    scaffolds: react-router-web:web
    # --yes to keep it non-interactive; the generator writes into the CWD it is run from,
    # which init-genesis-skeleton.py sets to service_root.
    init_cmd: npm create react-router@latest . -- --yes --no-git-init --no-install
    marker: package.json
    markers: package.json
