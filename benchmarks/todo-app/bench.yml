# The todo-app benchmark, entirely as data.
#
# This is the only file to edit when the benchmark's stack changes, and the only file to
# copy when adding a second benchmark app — `bench.py --spec <path>` hardcodes nothing
# about todo-app.
#
# Genesis itself carries no stack knowledge either: `scripts/check_public.py` asserts that
# no base workflow may depend on the private overlay, and the stack packs live there. So
# every stack-specific value is data, passed in as flow params. Each `surfaces` entry maps
# 1:1 onto a `workhorse-coder run genesis` invocation.

# Where the benchmark app gets built. Overridable with $TARGET.
target: /tmp/todo-app

# The benchmark's input, relative both to this file (the pristine copy) and to the target
# (where genesis seeds it). Every run starts from the same bullets, so the outcome is
# attributable to the workflows rather than to a backlog that drifted between runs.
backlog: docs/backlog.md

# The target repo's own gates. These do not feed the score — a half-built greenfield repo
# failing its own suite is expected — but a bullet scored `verified` while the suite that
# would prove it is red is a finding the scorecard calls out.
checks:
  - name: lint
    cmd: make lint
    timeout: 600
  - name: test
    cmd: make test
    timeout: 1800

# Optional overrides for the scoring agent. Empty means the active backend's defaults
# (`AGENT_CLI` picks the backend, exactly as it does for a workflow run).
judge: {}

repo:
  # No `name:` here on purpose — the repo's name is its directory name (so `/tmp/todo-app`
  # is `todo-app`). Two things key off it: the workspace `resolve_workspace` builds, and
  # the prefix farrier gives generated skills. Setting it separately here would let this
  # file disagree with the directory, which is how the workspace once ended up keyed on
  # "api".
  #
  # Rendered once, before any surface. Creates docs/epics/ (which flips ostler's graph
  # profile to `full`, arming the epic-coverage checks) and docs/backlog.md.
  docs_scaffold: shared-docs:docs

  # Packs the WORKFLOWS need, as opposed to the ones a surface's stack needs. Installed
  # with every surface so they are present regardless of which one runs first.
  #
  # Missing these is what made author escalate: its prompts resolve planning skills
  # through `instruction_ref('write-epics-and-stories')` and `instruction_ref('story-docs')`,
  # both supplied by product-planning. With the pack absent the refs resolved to nothing,
  # the epic-split gate failed, and `resolve_epics` — the auto-resolver that stands in for
  # a human at an operator gate — had to read the source skills directly to recover. Under
  # `operator_mode: human` that run would have stopped and asked.
  packs: product-planning

# service      logical name, and the workspace repo key
# service_root repo-relative directory the surface lives in
# packs        farrier packs supplying that stack's skills (resolved from the overlay)
# scaffolds    "<scaffold-id>:<dir>" pairs — folder convention + .gitignore hygiene
# init_cmd     the stack's own init tool; scaffolds do NOT produce a marker file
# marker       the file whose existence proves the skeleton is real
# markers      what agents.yml records as this repo's service_markers
surfaces:
  - service: api
    service_root: api
    packs: go
    scaffolds: go-service:api
    init_cmd: go mod init example.com/todo-app/api
    marker: go.mod
    markers: go.mod,main.go

  - service: web
    service_root: web
    packs: react-router
    scaffolds: react-router-web:web
    # --yes to keep it non-interactive; the generator writes into the CWD it is run from,
    # which init-genesis-skeleton.py sets to service_root.
    init_cmd: npm create react-router@latest . -- --yes --no-git-init --no-install
    marker: package.json
    markers: package.json

  - service: app
    service_root: app
    packs: flutter
    scaffolds: flutter-app:app
    # `flutter create .` refuses a name with dashes, so the project name is set explicitly.
    init_cmd: flutter create . --project-name todo_app --platforms=android,ios
    marker: pubspec.yaml
    markers: pubspec.yaml

  - service: infra
    service_root: infra
    packs: pulumi
    scaffolds: pulumi-infra:infra
    init_cmd: pulumi new gcp-go --name todo-app-infra --stack dev --yes --generate-only --force
    marker: Pulumi.yaml
    markers: Pulumi.yaml
