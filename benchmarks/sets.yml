# The model sets under test, and the one judge that grades all of them.
#
# A *set* is not a model. One `coder` run makes 41 agent turns — 34 at `power="high"`,
# 12 at `medium`, 2 at `low` — and a set may point each tier at a different model on a
# different backend. So results are keyed by the set's `label`, never by a model name,
# and the full mapping is recorded in every scorecard and manifest. "Which model was at
# `high`?" is then a question you ask of the manifests after the fact, rather than one
# the directory layout has to have anticipated.
#
#   matrix.py sets                     what is defined here
#   matrix.py gold --task <t>          produce/refresh the frozen reference
#   matrix.py run                      every set × every task, sequentially
#   matrix.py report --task <t>        per-bullet delta against gold

# ── The judge ─────────────────────────────────────────────────────────────────────────
# Applied to EVERY set's scoring, including gold, and deliberately independent of the
# `cli` each set runs its workflows on. Levels 2 and 3 are behavioral claims made by an
# agent reading the repo, so the judge is a measuring instrument; letting it vary with
# the thing being measured makes every delta uninterpretable.
#
# Changing anything here invalidates comparisons across the change. It is recorded in
# each manifest so a score that moved for this reason can be told apart from one that
# moved because a model did.
judge:
  cli: claude
  model: opus
  effort: high

# Which set is the reference every other set is scored against. It is an ordinary set —
# nothing about it is special except that `matrix.py report` subtracts it.
gold: gold

# ── The sets ──────────────────────────────────────────────────────────────────────────
# Each set spells out its full mapping rather than inheriting one. That is more typing,
# and it is what makes a set readable in isolation: an ablation that differs from its
# neighbour in one tier says so on its own face, and cannot silently drift when the
# neighbour is edited.
#
# `cli` picks the backend ($AGENT_CLI for that set's runs). `power.<tier>` is overlaid
# onto the spec's own `power` block, so a task spec that pins a tier for budget reasons
# still loses to the set — the set is the experiment.
#
# **Every non-gold set runs on `opencode`, and that is a constraint, not a coincidence.**
# The question these sets ask is "how much does the model matter", so the harness has to
# be the one thing that does not move between them — otherwise a delta is unattributable
# and the whole matrix is decoration. Gold is the exception by definition: it is claude
# because that is what real work runs on, and it is the reference rather than a peer.
#
# The concrete requirement on that harness is that it be *agentic*, and it is not a
# preference: the workflows' prompts render *paths* on every non-claude backend and
# expect the agent to go open them — 30 `find_by_tags(...)` sites listing layer
# instruction files, and 6 `skill_load_ref(...)` sites reading "Read `<path>` and follow
# its instructions". A harness with no read/grep/glob tool loop can open none of them,
# so its runs score a coder workflow with every skill reference silently dead, on top of
# not being able to search the app it was building — and the number that comes back
# measures the harness, not the model. That is what an earlier hosted set learned the
# expensive way. opencode drives a real tool loop and takes OpenRouter model ids directly
# (`openrouter/<vendor>/<model>`, no proxy) — see BACKENDS.md's `cline`/`opencode`
# comparison — so a set added later should stay on opencode for the same reason, unless a
# fresh ablation is deliberately testing the harness itself rather than the model.
#
# opencode over cline specifically because provider-pinning (below) is native to it:
# `~/.config/opencode/opencode.jsonc`'s `provider.openrouter.models.<id>.options.provider`
# pins one model to one upstream endpoint without ever changing the model-id string a
# turn sends — cline has no equivalent, so pinning it to a caching-capable endpoint means
# appending an OpenRouter *preset* slug to the model string, and cline's own telemetry
# (`model.info.pricing`) goes missing whenever that string carries a `@preset/` suffix,
# which would silently zero out every turn's recorded cost. opencode's pins are config,
# not string surgery, so its cost/cache telemetry stays intact.
#
# Every set below, `local-*` included, resolves through OpenRouter for now — the point of
# `local-mixed`/`local-cheap-high` is to price out the *hardware* before buying it, by
# running the same-sized models hosted rather than on a card we don't have yet. So every
# model here is `openrouter/<vendor>/<model>` (confirmed live on OpenRouter's `/models`
# endpoint). `OpenCodeBackend` passes `-m <model>` on every turn whenever a model string
# is given (`workhorse/workhorse/runner/backends/opencode.py::OpenCodeBackend.run_turn`),
# which is true of every tier of every set here — so the per-turn flag is what picks the
# model. Which upstream endpoint serves that model is a separate axis, pinned per-model in
# `opencode.jsonc` (not here) precisely so it can be re-priced against OpenRouter's
# `/endpoints` catalog without touching this file. An unresolvable model still fails the
# whole turn rather than falling back silently — so a typo'd or delisted slug is a hard
# error, not a silent swap to a default.
sets:
  # The reference. Claude Code at the tier real work runs at.
  - label: gold
    cli: claude
    notes: the reference every other set is measured against
    power:
      high: {claude: {model: opus, effort: high}}
      medium: {claude: {model: sonnet, effort: high}}
      low: {claude: {model: sonnet, effort: low}}

  # 24GB-card-sized, mixed by tier: the dense 27B where reasoning is load-bearing, the
  # 3B-active MoE everywhere else — hosted on OpenRouter for now, so the score is in
  # before the card is bought. The shape the hardware note recommends.
  - label: local-mixed
    cli: opencode
    notes: dense 27B at high, 3B-active MoE below it
    power:
      high: {opencode: {model: openrouter/qwen/qwen3.6-27b, effort: high}}
      medium: {opencode: {model: openrouter/qwen/qwen3.6-35b-a3b}}
      low: {opencode: {model: openrouter/qwen/qwen3-coder-30b-a3b-instruct}}

  # The ablation that pays for the one above: same set, cheap model promoted to `high`.
  # 34 of coder's 41 turns move, so if the score holds here the dense 27B is not earning
  # its VRAM.
  - label: local-cheap-high
    cli: opencode
    notes: ablation — does the high tier actually need the dense model?
    power:
      high: {opencode: {model: openrouter/qwen/qwen3.6-35b-a3b}}
      medium: {opencode: {model: openrouter/qwen/qwen3.6-35b-a3b}}
      low: {opencode: {model: openrouter/qwen/qwen3-coder-30b-a3b-instruct}}

  # The retry after `local-mixed`, and deliberately *not* mixed: one model at all three
  # tiers. A tier map is free when the models are hosted and a per-turn flag picks one,
  # but this set is pricing out a card, and on a card each distinct model is a separate
  # set of weights to hold or to swap in mid-run. Flattening the map is what makes the
  # score describe something you could actually run at home.
  #
  # It exists because `local-mixed`'s expense-split run is not cleanly attributable: the
  # coder reached 3 of 5 bullets verified with `go build`/`go test` green, and the failure
  # that stopped it was four `plan-qa` schema rejections — the same wall the gold claude
  # run hit three times. Re-running with the family as the only moving part is what
  # separates "these workflows need more than a 24GB card" from "that family cannot hold
  # a JSON schema".
  #
  # Mistral Small 3.2 rather than another qwen: dense 24B (~13GB at 4-bit, leaving the
  # card room for a long agentic turn's KV cache), 256k context, and the 3.2 point release
  # is the one that tightened function-calling and cut the repetitive generations that eat
  # a turn's budget. It advertises no `reasoning_effort`, so no tier here sets `effort` —
  # unlike `local-mixed`, whose `effort: high` on qwen3.6-27b is inert, that model not
  # listing the parameter as supported. A tier that silently means nothing is worse than
  # one that visibly does, and with one model at every tier the honest reading is that
  # this set has no tiers at all.
  #
  # That is the trade it accepts. `gpt-oss-20b` is the one model in this class with native
  # `reasoning_effort` and would keep three real tiers on a single set of weights — worth
  # reaching for if the flat map turns out to be what loses this run, rather than the model.
  - label: local-mixed-attempt-2
    cli: opencode
    notes: one model everywhere — dense Mistral 24B, sized for a single 24GB card
    power:
      high: {opencode: {model: openrouter/mistralai/mistral-small-3.2-24b-instruct}}
      medium: {opencode: {model: openrouter/mistralai/mistral-small-3.2-24b-instruct}}
      low: {opencode: {model: openrouter/mistralai/mistral-small-3.2-24b-instruct}}

  # Hosted and cheap: 1M context, tools and structured outputs, roughly two orders of
  # magnitude under gold per token.
  - label: hosted-cheap
    cli: opencode
    notes: DeepSeek V4 Flash throughout — the cost floor with a real context window
    power:
      high: {opencode: {model: openrouter/deepseek/deepseek-v4-flash}}
      medium: {opencode: {model: openrouter/deepseek/deepseek-v4-flash}}
      low: {opencode: {model: openrouter/deepseek/deepseek-v4-flash}}

  # Hosted, one frontier-vendor model throughout. Priced within a rounding error of the
  # cost floor on input and ~3.4x it on output, with the same 1M-token context — so a
  # score above `hosted-cheap` here is bought for very little, and a score at parity says
  # the floor was already enough. Native `reasoning_effort`, so `high` is a real tier
  # rather than the same call under a different name.
  - label: hosted-luna
    cli: opencode
    notes: GPT-5.6 Luna throughout — frontier vendor at near-floor prices
    power:
      high: {opencode: {model: openrouter/openai/gpt-5.6-luna, effort: high}}
      medium: {opencode: {model: openrouter/openai/gpt-5.6-luna}}
      low: {opencode: {model: openrouter/openai/gpt-5.6-luna, effort: low}}

  # Hosted, strong at the top only. Isolates the same question as `local-cheap-high`
  # from the other side: buy quality at `high` and nowhere else.
  - label: hosted-split
    cli: opencode
    notes: strong hosted model at high, cost floor below it
    power:
      high: {opencode: {model: openrouter/qwen/qwen3.5-397b-a17b}}
      medium: {opencode: {model: openrouter/deepseek/deepseek-v4-flash}}
      low: {opencode: {model: openrouter/deepseek/deepseek-v4-flash}}

# ── The tasks ─────────────────────────────────────────────────────────────────────────
# Spec paths relative to this file. Every task the matrix may run is listed here; which
# ones a given invocation actually runs is `--task` or `--tag`, not this list.
#
# The first three are sized so one set's genesis→author→coder chain lands inside an hour.
# `todo-app` is hours per cell and is the only one whose score means "how good are these
# workflows" — a bare `matrix.py run` therefore commits to days. Start with
# `matrix.py run --tag quick`, and reach for todo-app once a set is worth the wall clock.
tasks:
  - suites/link-shortener/benchmark.yaml
  - suites/bookmarks/benchmark.yaml
  - suites/expense-split/benchmark.yaml
  - suites/todo-app/benchmark.yaml
