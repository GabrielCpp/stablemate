# The workload task: one Go surface, five bullets, an hour.
#
# The bullet count is the whole design. Three bullets produce one epic and finish before
# the coder has looped over anything; five produce enough stories that the run must
# select repeatedly, and the failures worth catching only exist in that loop — a selector
# that re-picks a story it already built, a repair node entered once per story, a run that
# goes stale halfway down the queue. None of them can appear in a run with nothing to
# iterate over.
#
# Still one surface, so a failure here is not confounded by cross-stack decomposition;
# `bookmarks` is the spec that adds that variable, deliberately on its own.

target: /tmp/bench-expense-split
backlog: docs/backlog.md

# See suites/README.md for the vocabulary. `hour`, not `quick`: the five-bullet coder loop
# is the point, and it spends most of the hour.
tags: [hour, workload, api]

# See link-shortener/benchmark.yaml: all tiers flattened onto one cheap setting so
# wall-clock readings describe the nodes rather than the tier map.
power:
  low: {claude: {model: sonnet, effort: low}}
  medium: {claude: {model: sonnet, effort: low}}
  high: {claude: {model: sonnet, effort: low}}

# Coder gets the bulk of the hour: author writes the stories once, the coder loops.
#
# `author` was 900 and was measured missing it: five bullets decomposed to 3 epics / 5
# stories, and the ceiling landed at 927s with the last story mid-rework. A story that
# writes cleanly costs ~85s; the variable cost is the rework loop, and the one story that
# argued cost 318s across two audit→rework cycles. So the figure has to cover a backlog
# that disagrees with itself, not just one that writes cleanly — which is why it is not
# simply 5 × 85 plus the ~250s of epic-level decomposition. 1500 leaves room for roughly
# four more reworks than this run needed.
#
# `coder` was 2700 and was measured missing it by a wide margin: the ceiling arrived with
# story 1 of 5 still in QA. That one story cost the entire budget — dev 979s, review 265s,
# docs 499s, qa 958s — so the figure was never four stories short of enough, it was four
# stories short of one. The headline number is per story, not per run, and it is ~2000s:
#
#   dev    ~980s   plan-story 270 + implement-plan 692; the irreducible half
#   review  265s   one clean pass, no rework
#   docs    500s   three document→gate cycles, each closing a real finding and converging
#   qa      ~250s  planning, once the plan validates on the first attempt
#
# The qa reading above is 958s in this run because `plan-qa` ran three times against a
# prompt whose example taught two schema rules wrong (plan-global action ids, and the
# exactly-one-of do/expect/capture rule). Attempts cost 158s, 599s and 95s; the 599s one
# was spent reading ostler's own source to reverse-engineer the schema. That is fixed in
# the prompt and pinned by workflows/tests/coder/test_qa_plan_prompt_schema.py, so ~750s
# per story comes back — but even with it back, five stories is ~10000s.
#
# Which means the "an hour" in the header no longer describes this spec at five bullets.
# The budget below buys a complete five-story run so the loop failures the bullet count
# exists to expose can actually be reached; whether the benchmark should instead shrink to
# fit the hour is a separate call, and deliberately not made here.
budget:
  genesis: 600
  author: 1500
  coder: 11000

# Says out loud what the paragraph above works out: this task does not claim the hour. The
# task set's other specs still do, and are still held to it.
over_hour: >-
  five stories at ~2000s each. Shrinking the bullet count to fit the hour would remove the
  loop failures the bullet count exists to expose.

checks:
  - name: build
    cmd: cd api && go build ./...
    timeout: 300
  - name: test
    cmd: cd api && go test ./...
    timeout: 600

judge: {}

repo:
  docs_scaffold: shared-docs:docs
  # Identical to every other task's, and derived in `suites/todo-app/benchmark.yaml` from
  # the workflows' own reference call sites. This one loops the coder over five stories,
  # which is where a repeatedly-unresolved reference compounds rather than showing once.
  packs: product-planning,stablemate,infra

surfaces:
  - service: api
    service_root: api
    packs: go
    scaffolds: go-service:api
    init_cmd: go mod init example.com/expense-split/api
    marker: go.mod
    markers: go.mod,main.go
