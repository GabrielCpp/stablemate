# The smoke task: one Go surface, three bullets, half an hour.
#
# Sized to be re-run after every workflow fix, which is a design constraint and not a
# convenience: a benchmark you only run once a day gets consulted once a day, and a fix
# cycle that slow stops being a cycle. Small enough that a failure has one plausible
# cause — one epic, a handful of stories, one stack, no cross-surface anything.
#
# It is NOT a quality measure. Three bullets cannot rank a workflow; they can only tell
# you whether it still gets from a backlog to committed code without help. Read the score
# here as pass/fail and the reliability half as the actual output.

target: /tmp/bench-link-shortener
backlog: docs/backlog.md

# How this task is selected: `matrix.py run --tag quick`. Size first (`quick` = well under
# the hour), then job, then one tag per surface it exercises.
tags: [quick, smoke, api]

# Flatten the tier map: every node runs on the same cheap setting regardless of the
# `power=` it asks for. Node A being slower than node B is then a fact about the nodes,
# not about which tier they happened to declare — which is what makes a wall-clock
# reading from this spec mean anything.
power:
  low: {claude: {model: sonnet, effort: low}}
  medium: {claude: {model: sonnet, effort: low}}
  high: {claude: {model: sonnet, effort: low}}

# Per-phase wall-clock ceiling in seconds (WORKHORSE_MAX_RUNTIME_S). Checked between
# states, so an over-budget run halts on a node boundary with its checkpoint intact —
# score it, then resume it with `--resume-latest` if you want the rest.
#
# One hour per phase, flat. The earlier 600/600/1200 was measured against claude sonnet
# and is a claude-sonnet figure, not a property of the task: the first non-claude set to
# run this spec spent 657s inside a single `decompose-epics` turn and met the 600s author
# ceiling before the stage finished. A ceiling that only one backend can live under makes
# every other set's score a reading of the ceiling, so it is raised to a figure no
# reasonable backend hits — a runaway still stops, a slow model still finishes.
#
# `coder` gets more than the other two because it is the only phase whose work scales
# with the backlog: it runs the whole plan→implement→document→QA chain once per story,
# where genesis and author each run once per task. A ceiling equal to author's was the
# same claude-sonnet mistake one level down — local-mixed was killed at 3657s partway
# through story 1 of 2, and the two bullets story 2 covers scored `planned` for no reason
# but the clock, which is exactly the reading-the-ceiling failure above.
budget:
  genesis: 3600
  author: 3600
  coder: 11000

# Says out loud what the budgets above work out to, which the raise off claude-sonnet
# readings left unsaid: once a ceiling is set where no reasonable backend hits it, the
# spec is no longer promising the hour, and the hour test says so. The header still calls
# this the half-hour smoke task and that is still true of the run it describes — a claude
# set finishes well inside it. What is not true is the *ceiling* fitting in an hour, and
# the ceiling is what a slow set is scored against.
over_hour: >-
  the ceiling, not the run. A claude set finishes this in about half an hour and that is
  what the task is for; the budgets are sized so a slower backend's score measures the
  backend rather than the limit.

# The stack's own gates, run from the target root. Not `make lint` / `make test` like
# todo-app: nothing scaffolds a Makefile, so those would report a missing target as a red
# gate on every run and train you to ignore the row.
checks:
  - name: build
    cmd: cd api && go build ./...
    timeout: 300
  - name: test
    cmd: cd api && go test ./...
    timeout: 600

judge: {}

repo:
  docs_scaffold: shared-docs:docs
  # The same repo-level packs every task installs, and for the same reasons —
  # `suites/todo-app/benchmark.yaml` derives the list from the workflows' own
  # `instruction_ref` / `skill_load_ref` / `find_by_tags` call sites. A smoke run on a
  # thinner set would smoke-test a configuration nobody ships, so it stays identical.
  packs: product-planning,stablemate,infra

surfaces:
  - service: api
    service_root: api
    packs: go
    scaffolds: go-service:api
    init_cmd: go mod init example.com/link-shortener/api
    marker: go.mod
    markers: go.mod,main.go
