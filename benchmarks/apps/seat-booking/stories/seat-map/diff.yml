# The implementation diff a trial materializes for the `seat-map` story.
#
# `added:` paths are absent from the before-commit and present, uncommitted, in the
# worktree. `changed:` paths are committed from `pre/<path>` and then overwritten in the
# worktree. In both cases the worktree content comes from `post/<path>` when that file
# exists, and from the app tree otherwise.
#
# No file here carries a `post/` image, and neither does any other story: every story's
# worktree content is the app tree, so the app tree is the one thing a reader checks the
# book against rather than a fourth variant of it.
#
# That includes `app/service.py`, which this story authors whole — every documented route,
# including the two whose logic arrives in stories 2 and 3. It reads like a story reaching
# forward, and it is the opposite: `app/hold.py` and `app/confirm.py` are *already* in this
# story's worktree, because a trial materializes one story's diff and not a truncated app.
# Routing them from a later story bought nothing and cost the fixture its coherence — the
# frozen book documented `POST /api/seats/{id}/hold`, the seat-map trial answered `501`, and
# a QA agent reading that book found a contradiction that is real, permanent, and nothing to
# do with the defect under measurement. It also left this story's own acceptance criteria
# unreachable: three of them describe a seat that is *not* free, and nothing in a trial that
# refuses every mutation can produce one.
#
# What stays story-scoped is the diff, which is what QA is obligated over. The transitions
# still land in their own modules, and the endpoint nodes cite those modules rather than the
# handler, so the hold and booking obligations still arrive with stories 2 and 3.
story: seat-map
added:
  - app/__init__.py
  - app/store.py
  - app/booking.py
  - app/page.py
  - app/service.py
  - compose.yml
changed: []
