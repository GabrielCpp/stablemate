# How QA reaches the seat-booking service, on the host and from inside the sandbox.
#
# `entry_url` is the same string in both places on purpose. A sandboxed scenario opens
# `http://localhost:18083` exactly like a host one does; what differs is that inside the
# container that loopback port is forwarded to the published compose port, so no plan text
# has to change between a rehearsal and the scored run. Rewriting URLs at run time would
# mean the plan that ran is not the plan that was reviewed.

entry_url: http://localhost:18083
health_path: /healthz
# A substring of the response *body*, not a host:port — `/healthz` answers `{"status": "ok"}`.
identity: '"status": "ok"'
# `never`, not the `always` a stock fixture stack would take. `always` adopts whatever is
# already answering `/healthz` with the identity marker — and between two replays that is
# the *previous trial's* container, serving the previous trial's bind-mounted `app/`. The
# seeded defect would then not be in the service under test at all, and the trial would
# score a clean miss for a reason no report could show. The stack is code-dependent here by
# construction: `./app` is bind-mounted, so adoption is never safe.
reuse: never
boot_timeout: 60
# `--force-recreate` and deliberately **no** `down -v`. Recreating is what picks up the
# bind-mounted `app/` of *this* trial rather than the container a previous one left running.
# Destroying the volume here is a different thing entirely, and it is wrong: a bring-up is
# not once per trial. `ensure_stack` runs at the head of every plan lane, so a story that
# takes more than one lap gets its stack re-launched *while it is being observed* — and the
# book's `persists` obligation is proved by confirming a booking, restarting the service and
# reading it back. A `down -v` landing anywhere in that window empties the ledger and the
# booking is gone, which the evidence map records as `contradicted` on a durability the
# product actually has. That false contradiction was observed, and it is expensive: it
# scores against a defect the trial never seeded.
#
# So the ledger is reset at the two layers that own it, neither of which is here: the
# harness drops the volume once per trial (`replay.py`, before the run starts), and a
# scenario that needs a fresh showing asks for one over the documented route,
# `DELETE /api/showing`.
launch: docker compose -f compose.yml up -d --force-recreate --wait
health:
  - curl -sf -o /dev/null http://localhost:18083/healthz

sandbox:
  # The compose service publishes 18083 on the host, so the container reaches it through
  # docker's own host alias rather than by joining the compose network. That keeps the
  # fixture runnable on a machine where the network name has been taken by something else.
  forward:
    18083: host.docker.internal:18083
  images:
    base: ostler-qa-sandbox:base
    browser: ostler-qa-sandbox:browser
  gateway:
    # Deny-all. Nothing in this app's book needs a host verb: the whole product is an HTTP
    # service reachable over the forwarded port, and a benchmark that granted a verb it did
    # not need would be measuring a laxer sandbox than the one under test.
    allow: []
