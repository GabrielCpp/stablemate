# How a QA session brings this app up. The launch rebuilds: unlike a bind-mounted
# interpreter, a seeded defect in Go or TSX only reaches the running process through a
# compile, so `--build` is what makes a defect variant take effect at all.
entry_url: http://localhost:18084
health_path: /healthz
identity: '"status": "ok"'
reuse: never
boot_timeout: 120
launch: docker compose -f compose.yml up -d --build --force-recreate --wait
health:
  - curl -fsS http://localhost:18084/healthz
  - curl -fsS http://localhost:18084/api/policies
