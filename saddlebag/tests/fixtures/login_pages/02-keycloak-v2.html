<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>02 Keycloak v2</title>
  <link rel="stylesheet" href="style.css">
  <script src="probe.js"></script>
</head>
<body>
  <main class="pf-v5-c-login__main">
    <h1 id="kc-page-title">Sign in to your account</h1>
    <p>Keycloak v2 theme, wrapped inputs and a show-password button.</p>
    <form id="kc-form-login" class="pf-v5-c-form" onsubmit="login.disabled = true; return true;" action="#" method="post" novalidate>
      <div class="pf-v5-c-form__group">
        <label for="username" class="pf-v5-c-form__label">Username or email</label>
        <span class="pf-v5-c-form-control pf-m-required">
          <input required id="username" name="username" value="" type="text" autocomplete="username" autofocus aria-invalid="">
        </span>
      </div>
      <div class="pf-v5-c-form__group">
        <label for="password" class="pf-v5-c-form__label">Password</label>
        <div class="pf-v5-c-input-group">
          <div class="pf-v5-c-input-group__item pf-m-fill">
            <span class="pf-v5-c-form-control pf-m-required">
              <input required id="password" name="password" value="" type="password" autocomplete="current-password" aria-invalid="" data-password-toggle>
            </span>
          </div>
          <button type="button" class="pf-v5-c-button pf-m-control" aria-label="Show password" aria-controls="password" id="toggle">Show</button>
        </div>
      </div>
      <input type="hidden" id="id-hidden-input" name="credentialId">
      <button class="pf-v5-c-button pf-m-primary" name="login" id="kc-login" type="submit">Sign In</button>
    </form>
  </main>
  <pre id="probe"></pre>
  <script>
    document.getElementById("toggle").addEventListener("click", (event) => {
      const field = document.getElementById("password");
      const showing = field.type === "text";
      field.type = showing ? "password" : "text";
      event.target.textContent = showing ? "Show" : "Hide";
      event.target.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    });
  </script>
</body>
</html>
