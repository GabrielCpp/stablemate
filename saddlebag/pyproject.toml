[project]
name = "saddlebag"
version = "2.0.0"
description = "A Vault-backed daemon that fills secrets into browsers and commands without printing them."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Côté" }]
keywords = ["credentials", "secrets", "vault", "agents", "workflow", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
  "Topic :: Utilities",
]
dependencies = [
  "hvac>=2.0",
  "platformdirs>=4.0",
  "websockets>=13.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/GabrielCpp/stablemate/tree/main/saddlebag"
Repository = "https://github.com/GabrielCpp/stablemate"
Issues = "https://github.com/GabrielCpp/stablemate/issues"

[project.scripts]
saddlebag = "saddlebag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saddlebag"]

[tool.hatch.build.targets.sdist]
include = ["saddlebag", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Discard a passing test's tmp_path immediately; keep it only for a failure. pytest's
# default (`all`) retains three whole runs' worth of sandboxes.
tmp_path_retention_policy = "failed"
# A test suite that ships with warnings is a test suite with broken windows: the next
# person to add a test sees a warning they cannot interpret and assumes it is theirs,
# then learns to ignore the whole stream. Every warning is an error so a real one
# surfaces immediately.
filterwarnings = [
  "error",
]
