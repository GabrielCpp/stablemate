# ============================================================================
# agents.yml — complete reference for the `farrier` installer
# ============================================================================
#
# Copy this file to your repository root as `agents.yml`, then prune it to the
# keys you need. farrier reads it to decide which skills, prompts and roots from
# the prompt library to render into your repo's adapter files, and which scaffold
# ids `farrier scaffold` may apply.
#
# It does NOT install workflows. A workflow is an installed Python distribution
# that brings its own command — you `pip install` it and run
# `workhorse-<name> run`. The one key here a workflow reads for itself is
# `workflow:` at the bottom.
#
# Run it (after `pipx install farrier` and pointing farrier at the library):
#   farrier config set-library /path/to/the/library     # one-time
#   farrier --repo .            # render/install
#   farrier --repo . --check    # verify generated files are current (no writes)
#
# Every key below is OPTIONAL unless marked REQUIRED. Where two spellings are
# shown (camelCase / snake_case), either is accepted.
# ============================================================================


# ---------------------------------------------------------------------------
# repo — repository identity. The name is the repo DIRECTORY's name, kebab-cased,
# and is prepended to every installed skill and prompt (skill `db.md` →
# `<name>-db`). It is derived, not configurable: the workflow tooling reads the
# same name off the checkout, so a config that could disagree with the directory
# would rename half the toolchain's view of the repo and not the other half.
#
# Any OTHER key here is passed through to Jinja as `repo.<key>` for library
# templates; `name` and `prefix` are reserved and ignored.
# ---------------------------------------------------------------------------
# repo:
#   support_email: team@example.com


# ---------------------------------------------------------------------------
# agents — REQUIRED. Which assistant adapters to generate. At least one must be
# truthy or farrier errors. Mapping form (with booleans) or list form.
#
#   claude  → .claude/skills/<name>/SKILL.md      + .claude/commands/<name>.md
#   codex   → .agents/skills/<name>/SKILL.md      + .agents/prompts/<name>.prompt.md
#   copilot → .github/skills/<name>/SKILL.md, .github/prompts/<name>.prompt.md,
#             and roots → .github/copilot-instructions.md
# ---------------------------------------------------------------------------
agents:
  claude: true
  codex: false
  copilot: false
# list form (equivalent to enabling just these):
# agents: [claude]


# ---------------------------------------------------------------------------
# packs — named bundles from the library's packs/*.yml (omit the .yml). A pack
# selects a set of skills/prompts/roots/scaffolds and may `include` other packs.
# All selected packs are merged (union).
# ---------------------------------------------------------------------------
packs:
  - go
  - flutter
  - shared-lifecycle


# ---------------------------------------------------------------------------
# skills / prompts / roots — extra individual selections ADDED on top of what
# the packs pull in (union, not replacement). Glob patterns are allowed for
# skills and prompts.
# ---------------------------------------------------------------------------
skills:
  - planning/*            # every skill under the library's planning/ group
prompts:
  - review/*
roots:
  - api-service               # a root instruction (mainly used by copilot)


# ---------------------------------------------------------------------------
# scaffolds — scaffold ids (from the library's scaffolds/*.yml definitions)
# this repo may apply with `farrier scaffold <id> --param key=value`. Applied
# on demand, never at install time; placement folders are --param values.
# Scaffolded files are seeds: never overwritten once present, exempt from
# --check. Packs contribute ids too (union).
# ---------------------------------------------------------------------------
scaffolds:
  - shared-docs           # standard docs/ hierarchy (default dir: docs)
  - flutter-app           # curated Flutter .gitignore (e.g. --param dir=app)
  - go-service            # curated Go .gitignore     (e.g. --param dir=api)


# ---------------------------------------------------------------------------
# exclude — suppress items a pack pulls in but this repo does not want. Glob
# patterns, matched against library paths.
# ---------------------------------------------------------------------------
exclude:
  skills:
    - go/experimental-*
  prompts:
    - planning/spike-*
  scaffolds:
    - shared-docs/CONTRIBUTING.md


# ---------------------------------------------------------------------------
# localInstructions — render selected (already-installed) skills as local
# CLAUDE.md / AGENTS.md / CODEX.md files in chosen directories, so the assistant
# auto-loads those rules contextually from any ancestor dir.
#
# Provide EITHER `skill` (one) or `skills` (many, concatenated in order); add
# `prompt`/`prompts` for installed prompts, and `policy`/`policies` for library
# text that exists only here (never installed as a skill, so it costs nothing in
# the every-turn skill index). The three are aggregated policies → skills →
# prompts. Policies are named by bare basename, with no repo prefix.
# The names must match INSTALLED skill names (i.e. include the prefix), or the
# render fails when it can't find the source.
# ---------------------------------------------------------------------------
localInstructions:
  - skills: [myrepo, myrepo-developer]
    paths: ["."]              # repo root
    includeReadme: inline     # inline (default) | import | none  (true=inline, false=none)
  - skill: myrepo-go
    paths: ["api"]            # write under api/
    includeReadme: import     # Claude `@README.md` directive; others fall back to inline


# ---------------------------------------------------------------------------
# lint — per-service lint command OVERRIDES for the coder workflow's lint gate.
# The gate runs after each service is implemented (and again at QA) and routes a
# dirty result back to rework. By CONVENTION it runs `make lint` in the service's
# directory when that Makefile has a `lint` target — a service with no such target
# is skipped (opt-in), so most repos need nothing here. Add an entry only to run a
# DIFFERENT command for a service; the key is the service name (or its directory).
#   groom's `make lint` runs ruff + a dependency-free HTML accessibility scan.
# lint:
#   groom: make lint                 # explicit (also the convention default)
#   api: golangci-lint run ./...     # a service that doesn't use `make lint`
#   web: npm run lint && npm run a11y


# ---------------------------------------------------------------------------
# template (preferred) / vars (legacy alias) — Jinja2 values injected into
# every rendered skill and prompt. Reference them in library source as
# `{{ template.<key> }}`. Both tables are merged into one context; use
# `template` for new configs. Shared library prompts should use
# `| default("…")` so they stay installable when a key is absent.
# ---------------------------------------------------------------------------
template:
  backend_layer_name: "Go API"
  go_module: github.com/org/myrepo
  go_cli_name: appctl
  app_path: app
  api_path: api
  openapi_path: api/pkg/api/openapi.yaml
# vars:                       # legacy spelling; merged with `template`
#   backend_layer_name: "Go API"


# ---------------------------------------------------------------------------
# workflow — an opaque block farrier passes through untouched. The installer
# reads nothing in it; the WORKFLOW packages you run read their own keys out of
# it, so what belongs here is whatever the workflow you installed documents.
# camelCase or snake_case accepted.
#
# (`repoUrl`, `branch`, `agentsDir` and `envPassthrough` used to live here to
# configure a generated Docker launcher. That launcher is gone — a workflow's own
# command takes its arguments on the command line — and those keys are now ignored.)
# ---------------------------------------------------------------------------
workflow:
  # Name of the env var carrying the GitHub token for the coder workflow's PR
  # and CI steps (falls back to GH_TOKEN then GITHUB_TOKEN).
  githubTokenEnv: GH_TOKEN

  # storyCoder (and similar) — an opaque, workflow-specific subtree passed
  # through to the workflow's prompts/templates. farrier does not interpret its
  # internals; shape it to whatever the installed workflow documents.
  # storyCoder:
  #   prompts:
  #     plan: myrepo-plan-story
  #     implement: myrepo-implement-plan
  #   successGate:
  #     apiPath: api
  #     apiCommand: make test


# ---------------------------------------------------------------------------
# services — the deterministic gates a workflow runs against a service, keyed by
# the service's name or (as a fallback) its type. farrier passes this through
# untouched; the coder workflow's dev lane reads it, and it is the ONLY place
# the commands come from.
#
# A gate a service does not declare is skipped, never guessed at: a command the
# workflow invented would fail a story on the workflow's assumption about your
# stack rather than on your code. `farrier doctor` reports which gates a repo
# has and has not adopted.
#
# The name key beats the type key, so two services of one type in a monorepo can
# run different commands.
# ---------------------------------------------------------------------------
# services:
#   go:                       # by type — every Go service in this repo
#     lint: golangci-lint run
#     test: go test ./...
#   api-service:              # by name — wins over the type above
#     test: go test -tags integration ./...
