[project]
name = "farrier"
version = "1.5.2"
description = "Render an agent-neutral prompt library into a repository's Codex/Claude/Copilot adapters."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Côté" }]
keywords = ["agent", "prompts", "skills", "claude", "codex", "copilot", "installer"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = [
  "jinja2>=3.1",
  "pyyaml>=6.0",
  # platformdirs and tomli-w are farrier._vendor.stablemate_core's, not farrier's own:
  # the shared config file, base-library discovery and the cache are vendored in rather
  # than depended on (see core/README.md), so their requirements land here.
  "platformdirs>=4",
  "tomli-w>=1.0",
  # Front matter and headings are located by the parser, never by a regex over raw text
  # (see farrier/frontmatter.py). Same parser ostler uses, without the dependency edge.
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
]

[project.urls]
Homepage = "https://github.com/GabrielCpp/stablemate"
Repository = "https://github.com/GabrielCpp/stablemate"
Issues = "https://github.com/GabrielCpp/stablemate/issues"

[project.scripts]
farrier = "farrier.install:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["farrier"]

[tool.hatch.build.targets.sdist]
include = ["farrier", "README.md", "LICENSE", "agents.example.yml", "docs"]
