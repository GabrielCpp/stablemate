# How a QA session brings this app up. The launch rebuilds: unlike a bind-mounted
# interpreter, a seeded defect in Go only reaches the running process through a compile, so
# `--build` is what makes a defect variant take effect at all.
#
# The boot budget is larger than policy-desk's because coming up means three services, one
# of which is a JVM: the auth emulator has to answer before the seed can create the three
# identities, and the API refuses to be called until they exist.
entry_url: http://localhost:18085
health_path: /healthz
identity: '"status":"ok"'
reuse: never
boot_timeout: 240
launch: docker compose -f compose.yml up -d --build --force-recreate --wait
health:
  - curl -fsS http://localhost:18085/healthz
