# seat-booking — the fictive app the standalone-QA benchmark measures against.
#
# The pack list is short because this repo is a *fixture*, not a product: what a trial
# needs is whatever the QA lane reads, and nothing that would make one trial differ from
# the next. `stablemate` is also the only pack that ships in `base-library/` — the
# benchmark has to resolve from a public clone, and `scripts/check_public.py` asserts the
# base library stands alone — so naming any other pack here would make the fixture
# unbuildable for everyone outside a private overlay.
#
# `repo.name` is derived from the directory name, which is why a trial must materialize
# this tree into a directory called exactly `seat-booking`: every generated skill is
# prefixed with it, and the book's own references resolve through that prefix.

agents:
  claude: true

packs:
  - stablemate

# The one QA tool this fixture opts into, and the reason it has to exist.
#
# `confirm-booking`'s AC5 — "a confirmed booking survives a restart" — is an obligation no
# HTTP call can discharge: the plan API exposes requests, assertions and captures, and
# nothing that stops and starts the service. With no tool declared here, the catalog the
# planner reads is empty, the honest plan blocks rather than passing off an immediate
# read-after-write as durability, and every trial on that story parks at the operator gate.
# A book obligation no declared tool can prove is fixture debt, not a QA failure.
#
# `docker` rather than a bespoke `restart` shim because the tool contract resolves a name
# to one command on PATH (`ostler.qa.tools`), and a wrapper script committed here would
# have to be found by a path that differs in every trial's checkout. A scenario reaches it
# as `qa.tool("docker").run("compose", "-f", "compose.yml", "restart")`, from the repo root
# — the same compose file the book's `runbook` node boots the app with.
#
# Its definition is machine-side, in the config a task pins (`paddock/data/configs/`), which
# is the opt-in/definition split the tool registry is built around: this file says which
# tools the fixture may reach for, the config says what they are on this host.

qa:
  tools:
    - docker
