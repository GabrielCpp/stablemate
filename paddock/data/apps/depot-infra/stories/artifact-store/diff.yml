# The implementation diff a trial materializes for the `artifact-store` story.
#
# `added:` paths are absent from the before-commit and present, uncommitted, in the
# worktree. There is no `changed:` here and no `pre/` directory: this is the first story.
#
# There IS a `post/`, unlike claims-api's first story, and only for two files. `main.go` and
