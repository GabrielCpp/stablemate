# The implementation diff a trial materializes for the `create-policy` story.
#
# `added:` paths are absent from the before-commit and present, uncommitted, in the
# worktree. `changed:` paths are committed from `pre/<path>` and then overwritten in the
# worktree. In both cases the worktree content comes from `post/<path>` when that file
# exists, and from the app tree otherwise — this is the first story, so the three modules
# later stories keep extending are pinned to their story-1 shape by `post/`.
#
# The write path comes first because everything else in the app reads what it wrote: the
# register has nothing to list and the amendment screens have nothing to amend until a
# policy can be put on file.
story: create-policy
