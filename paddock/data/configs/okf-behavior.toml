# Match the default variant actually used by the recorded v1/v2 evaluations.
# Omit effort rather than requesting an adapter-unsupported spelling.
config_version = 1
default_cli = "opencode"

[default.opencode]
model = "openai/gpt-5.6-terra"

[power.low.opencode]
model = "openai/gpt-5.6-terra"

[power.medium.opencode]
model = "openai/gpt-5.6-terra"

[power.high.opencode]
model = "openai/gpt-5.6-terra"

[power.smart.opencode]
model = "openai/gpt-5.6-terra"
