# The model tables a benchmark task pins, and nothing else.
#
# `workhorse-coder run --config` replaces the machine's stablemate config whole — no
# merge — so a task that names this file measures these models rather than whatever the
# operator happens to have selected today. That is the entire point: a scorecard produced
# under an unpinned config compares against nothing.
#
# What is deliberately absent is every path. `library_dir`, `stablemate_dir` and
# `worktree_dir` are machine-local, and a tracked absolute path is a lie on every machine
# but the one it was written on — and, in a public repo, a lie that names a private
# directory. A task fills them at run time from `stablemate_core.config`, rendering the
# effective config into its scratch directory; this file stays the part that is the same
# everywhere.

config_version = 1
default_cli = "opencode"

# These are `openai/` ids, not `openrouter/openai/` ones, because opencode reaches them
# over the ChatGPT-subscription oauth credential rather than a metered API key. Two
# consequences worth knowing before reading a scorecard produced under this file.
#
# The cost column becomes *rate-card*, not billed. groom prices a trial by multiplying
# reported tokens against models.dev's table, and that table does not know a subscription
# is paying. The dollar figures stay comparable between two rounds run under this config —
# which is what the scorecard uses them for — but they are not an invoice.
#
# The scarce resource becomes plan quota, not credit, and quota refills on a clock rather
# than on a top-up. A round that exhausts it fails mid-flight on the provider's side, so
# `terra` carries the three tiers that run per-node and `sol` only the two that a workflow
# reaches for deliberately. There is no subscription-side `luna`, which is what these
# tables held before; `terra` is the nearest step up from it.

[power.high.opencode]
model = "openai/gpt-5.6-terra"
effort = "medium"

[power.smart.opencode]
model = "openai/gpt-5.6-sol"
effort = "high"

[power.extra-smart.opencode]
model = "openai/gpt-5.6-sol"
effort = "high"

[power.medium.opencode]
model = "openai/gpt-5.6-terra"
effort = "medium"

[power.low.opencode]
model = "openai/gpt-5.6-terra"
effort = "low"

[default.opencode]
model = "openai/gpt-5.6-terra"
effort = "medium"

# The QA tools a fixture may opt into, defined here rather than on the machine.
#
# `ostler.qa.tools` splits a tool in two: the repo's `agents.yml` says which names its QA
# plans may reach for, and the stablemate config says what each name is on this host. A
# task pins this file as the whole config, so a definition that lives here is the same on
# every machine a round runs on — which is the property a benchmark needs and a
# `~/.config` entry does not have.
#
# `docker` is here for `seat-booking`'s restart obligation; opting into it is per-app, and
# only that app's `agents.yml` does.
[qa_tools.docker]
command = "docker"
description = "the docker CLI, for restarting the app under test between two observations"

# `jq` is here for the other half of the durability story: not "does it survive a restart"
# but "is it on disk at all". The `persists` pattern's evidence is the durable store *file*
# — after an accepted write, the record is in it — and a QA plan cannot read that file
# itself. `ostler.qa.lint` reserves filesystem and process access for approved tools, on
# purpose, so the only lawful reader is one named here.
#
# Without this entry the pattern is unreachable rather than merely awkward: the plan's
# direct `open()` is rejected by lint, `qa.tool("jq")` is fail-closed because no
# `[qa_tools.jq]` table exists in the pinned config, and the lane is left choosing between
# substituting a test suite for runtime evidence and blocking. A greenfield round blocked
# there, correctly, which is how this line came to be written.
[qa_tools.jq]
command = "jq"
description = "the jq CLI, for reading a durable store file as evidence that a write persisted"

# `make` is here for `depot-infra`, whose product never runs. That app's whole observable
# behaviour is the plan `pulumi preview` writes, and the documented way to get one is the
# `make -C pulumi plan` target its ops page publishes. Routing QA through the same target a
# person would type is the point: a plan taken by invoking `pulumi` directly would be
# evidence about pulumi, and would silently stop being evidence about the depot's route the
# first time the Makefile changed a flag.
#
# It carries no arguments of its own — the target and its directory are the plan's, and the
# backend and passphrase are stated inside the Makefile — so nothing here is app-specific.
[qa_tools.make]
command = "make"
description = "the make CLI, for driving a repo's own documented build and plan targets"

# `python3` is here for `tally-cli`, whose product is a command rather than a service. A QA
# plan may not import the package it is testing — `ostler.qa.lint`'s allowlist reserves the
# process for approved tools — so even an app written in the harness's own language is driven
# over a process boundary, as `python3 -m tally`, and needs a definition here to be reachable
# at all.
#
# The name is the interpreter rather than the app: nothing about this entry is tally's, and
# the next stdlib-only Python fixture opts into the same one.
[qa_tools.python3]
command = "python3"
description = "the python interpreter, for driving a Python CLI over a process boundary"
