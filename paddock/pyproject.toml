[project]
name = "paddock"
version = "0.1.0"
description = "The benchmark harness: copy a benchmark's repository, run real CLI steps against it, and score the result when the task brought its own ruler."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Côté" }]
keywords = ["benchmark", "agents", "workflow", "evaluation", "fixtures"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Utilities",
]
dependencies = [
  # The sandbox parses a stablemate config it did not write, so it is validated rather
  # than `.get()`-ed.
  "pydantic>=2.0",
  # `tomllib` reads and does not write; a run writes its merged home config.
  "tomli-w>=1.0",
  # platformdirs and tomli-w are paddock._vendor.stablemate_core's, not paddock's own:
  # `make check-vendor` compares files and cannot notice a missing requirement.
  "platformdirs>=4.0",
  # The task API drives workhorse, reads the planning graph through ostler and parses
  # the front matter and answer keys the apps carry.
  "workhorse-agent>=5,<6",
  "ostler>=4,<5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-xdist>=3.6"]

[project.urls]
Homepage = "https://github.com/GabrielCpp/stablemate/tree/main/paddock"
Repository = "https://github.com/GabrielCpp/stablemate"
Issues = "https://github.com/GabrielCpp/stablemate/issues"

[project.scripts]
paddock = "paddock.cli:main"

[tool.uv.sources]
workhorse-agent = { workspace = true }
ostler = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paddock"]

[tool.hatch.build.targets.sdist]
include = ["paddock", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_policy = "failed"
markers = [
    "toolchain: validates fixture variants with external compilers or planners",
    "mutation: runs the differential mutant corpus",
    "stress: exercises timing-sensitive filesystem behavior repeatedly",
]
# A test suite that ships with warnings is a test suite with broken windows: the next
# person to add a test sees a warning they cannot interpret and assumes it is theirs,
# then learns to ignore the whole stream. Every warning is an error so a real one
# surfaces immediately.
filterwarnings = [
  "error",
]
