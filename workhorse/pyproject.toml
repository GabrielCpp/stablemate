[project]
name = "workhorse-agent"
version = "2.0.0"
description = "Fail-soft engine for agent workflows written in Python — drives an agent CLI through a checkpointed state machine, unattended for days."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Côté" }]
keywords = ["agent", "workflow", "claude", "llm", "automation", "orchestration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = [
  # platformdirs and tomli-w are workhorse._vendor.stablemate_core's, not workhorse's
  # own: the shared config file, base-library discovery and the cache are vendored in
  # rather than depended on (see core/README.md), so their requirements land here.
  "platformdirs>=4.0",
  "tomli-w>=1.0",
  # Prompt rendering (templates.py) and the static reference scan (references.py).
  "jinja2>=3.1",
  # Every value crossing a boundary — an agent's JSON reply, a node's return, the
  # context manifest — is a model.
  "pydantic>=2.0",
  # Tolerant parsing of an agent reply that is *almost* JSON, before the recovery
  # ladder spends a retry on it.
  "json-repair>=0.30",
  # Recognize canonical operator-gate headings without mistaking examples inside fenced
  # code for document structure.
  "markdown-it-py>=3.0",
  # OpenTelemetry instrumentation (see workhorse/otel.py). **Required, not optional.**
  # It was an `otel` extra, and the failure that ended that: an install which omits it
  # is not "a run without telemetry" but a run that is *invisible* — telemetry fails
  # soft by design, so a venv missing the SDK exports nothing and says nothing, and the
  # dashboard simply never shows the run. That is indistinguishable from a dead run, and
  # the runs it happens to are the unattended multi-hour ones telemetry exists for. Two
  # pure-python wheels are a cheap price for "installed implies observable".
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]
# Deliberately short. The engine is workflow-agnostic, so anything a *workflow* reads
# belongs on `workhorse-workflows`, not here: YAML (pyyaml/ruamel.yaml) left with the
# retired YAML front-end and is declared by the workflows that parse it. `platformdirs`
# is stablemate-core's business — the config/cache paths are the whole reason that
# package exists — and nothing under `workhorse/` imports it directly.

[project.optional-dependencies]
# pytest-xdist: the workflow integration suites (e.g. the coder workflow's tests,
# which drive the real CLI as a subprocess per test) are subprocess/CPU-bound and
# shard cleanly across cores — running them with `-n auto` needs xdist.
test = ["pytest>=8.0", "pytest-xdist>=3.0"]
# `otel` is kept as an empty alias so an existing `workhorse-agent[otel]` install line —
# in a Dockerfile, a CI job, another repo's lockfile — keeps resolving instead of failing
# on an unknown extra. The SDK it used to carry is now a hard dependency above.
otel = []

[project.urls]
Homepage = "https://github.com/GabrielCpp/stablemate/tree/main/workhorse"
Repository = "https://github.com/GabrielCpp/stablemate"
Issues = "https://github.com/GabrielCpp/stablemate/issues"

# No `[project.scripts]`. Workhorse is a library: it ships the *wiring* for a command
# line (`workhorse.console_script`) but drives no command of its own, because a generic
# runner would need to resolve a workflow by name and there is nothing to resolve it
# against. A workflow distribution binds its own script — see workflows/pyproject.toml.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workhorse"]

[tool.hatch.build.targets.sdist]
include = ["workhorse", "README.md", "LICENSE", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Autoclean. These tests drive whole runs against sandbox repos, and a run writes one
# artifact set per node step. pytest's default (`all`) keeps a passing test's sandbox and
# retains the three most recent runs, which is how a green suite still fills a disk. Keep
# a sandbox only when it can still be read for a reason: a failing test.
tmp_path_retention_policy = "failed"
