[project]
name = "groom"
version = "1.1.0"
description = "Local push-driven dashboard for workhorse agent-workflow operator gates — tends the horses while they run."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Côté" }]
keywords = ["agent", "workflow", "claude", "dashboard", "operator", "litestar", "preact"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = [
  "litestar[standard]>=2.10",
  "workhorse-agent",
  # The sidecar's filesystem watch. watchfiles rather than a raw inotify binding
  # because the sidecar and its tests have to run on the machines people develop
  # on: `inotify_simple` imports fine on macOS and then dies at `INotify()` with a
  # missing-symbol AttributeError. watchfiles carries inotify/FSEvents/
  # ReadDirectoryChangesW behind one API, so the Linux container keeps inotify and
  # nothing else has to be a Linux-only path. It also arrives transitively via
  # litestar[standard]'s uvicorn, but groom.sidecar imports it directly.
  "watchfiles>=0.21",
  # The in-container sidecar dials groom as a WebSocket client for its
  # persistent session (see groom/sidecar.py). websockets also arrives
  # transitively via litestar[standard]'s uvicorn, but the sidecar imports it
  # directly, so declare it.
  "websockets>=13",
  # Decode standard OTLP/HTTP protobuf on /v1/traces + /v1/metrics (groom is
  # workhorse's default local collector — see groom/otlp.py). Proto classes
  # only; groom needs no OTel SDK.
  "opentelemetry-proto>=1.25",
  # groom.store places groom.db in the platform data dir (already transitive
  # via workhorse-agent, but imported directly, so declared).
  "platformdirs>=4.0",
]

[project.optional-dependencies]
# playwright drives a real Chromium against a booted groom for the accessibility
# suite (tests/test_a11y_dynamic.py); the browser itself is a separate download,
# `uv run playwright install chromium`. Absent either, that file skips loudly.
test = ["pytest>=8.0", "playwright>=1.44"]

[project.urls]
Homepage = "https://github.com/GabrielCpp/stablemate/tree/main/groom"
Repository = "https://github.com/GabrielCpp/stablemate"
Issues = "https://github.com/GabrielCpp/stablemate/issues"

[project.scripts]
groom = "groom.cli:main"
groom-sidecar = "groom.cli:sidecar_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groom"]

[tool.hatch.build.targets.sdist]
include = ["groom", "README.md", "LICENSE", "docs"]

[tool.uv.sources]
workhorse-agent = { workspace = true }
