# stablemate — a uv workspace housing the publishable packages that work
# alongside the prompt library:
#   - workhorse/  -> workhorse-agent  (the fail-soft workflow runtime)
#   - workflows/  -> workhorse-workflows (the workflows themselves, as code that
#                                       workhorse discovers by entry point)
#   - farrier/    -> farrier          (renders the prompt library into a repo)
#   - ostler/     -> ostler           (tends a repo's docs/ knowledge graph)
#   - groom/      -> stablemate-groom (local dashboard + push notifications for
#                                       workhorse operator gates; the import package
#                                       and the command stay `groom`)
#   - saddlebag/  -> stablemate-saddlebag (Vault-backed daemon that fills secrets
#                                       into browsers and commands; the import
#                                       package and the command stay `saddlebag`)
#   - paddock/    -> paddock          (the benchmark harness: benchmarks, tasks, results)
#   - stablemate/ -> stablemate       (the umbrella: no code, major ranges on
#                                       every published tool, so one
#                                       `uv tool install` brings them all)
#   - core/       -> (no distribution)  (shared plumbing: the home config, base-library
#                                       discovery, the base-library cache. A member so it
#                                       can be tested and imported in a checkout, but it
#                                       is never published: `make vendor` copies it into
#                                       workhorse and farrier, which ship it. See
#                                       core/README.md)
#
# base-library/ is NOT a package and NOT a workspace member: it is the base library
# itself — plain data (library/, packs/) that the tools locate on disk or fetch from
# git into ~/.cache/stablemate. Nothing imports it.
#
# Library content resolves across two layers: the base (base-library/, above) and an
# optional private overlay that shadows it, pointed at with
# `farrier config set-library <path>`. The base is data with nothing to import, so no
# dependency runs in either direction — which is what lets content version on its own
# clock. A workflow is a Python distribution, so the tools it needs are ordinary
# [project.dependencies] that pip/uv resolve at install time — the library declares
# nothing. (The retired YAML front-end used a per-workflow `requires:` block instead,
# because data cannot have dependencies.)
#
# This root is the workspace anchor and a member (per uv's "every workspace needs
# a root, which is also a workspace member"). It declares [project] but NO
# [build-system], so — per the uv docs — uv "will not attempt to build or install
# the project itself, just its dependencies". It is never published; the member
# packages are built and released independently.

[project]
name = "stablemate-workspace"
version = "0.0.0"
description = "Workspace anchor for the stablemate, workhorse-agent, farrier, ostler, stablemate-groom and stablemate-saddlebag packages (not published)."
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["core", "workhorse", "workflows", "farrier", "ostler", "groom", "saddlebag", "paddock", "stablemate"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    # The workflow suites drive real subprocesses per test, so they are CPU-bound and
    # shard cleanly across cores. Came in with the workflows, and kept: the `-n auto`
    # pytest.ini that asked for it lived in the YAML tree, but the suites did not go
    # with it.
    "pytest-xdist>=3.6",
    # A test that drives a workflow to a gate it cannot satisfy does not fail — the
    # driver enters an operator `await` and polls a file no one will write, forever. That
    # is not a slow suite, it is a suite with no upper bound: it held a CI runner for
    # seventeen minutes before a human cancelled it, and would have held it for six hours.
    # The per-test cap turns that into one named failure with a traceback pointing at the
    # state that wedged.
    "pytest-timeout>=2.3",
    "ruff>=0.15.20",
    # The type checker, run from this root next to ruff (`make lint`). Pinned as a dev
    # dependency rather than invoked with `uvx` so every clone and CI run checks against
    # the same version — a type checker that floats reports a different set of findings
    # per machine, which is the one thing a gate must not do.
    "ty>=0.0.65",
    # The third checker in the gate. ty and basedpyright disagree often enough to be
    # worth both: ty is fast and follows this workspace's own calls, basedpyright
    # carries pyright's inference and its bundled stubs, so it sees through the
    # third-party libraries ty treats as opaque. Pinned here for the same reason ty is
    # — a checker that floats reports a different set of findings per machine.
    "basedpyright>=1.31",
    "playwright>=1.40",
    "pillow>=10.0",
    # `scripts/bench_ostler_doctor.py` imports ostler directly — it measures the library,
    # not the CLI. A bare `uv run` syncs this root and its dev group only, so without the
    # declaration below the harness resolves ostler purely by accident: it works in a
    # clone that has run `uv sync --all-packages` and dies with ModuleNotFoundError in a
    # fresh checkout that has not. Declaring it is what makes `uv run python
    # scripts/bench_ostler_doctor.py` mean the same thing everywhere.
    "ostler",
]

[tool.uv.sources]
# The workspace member, not the published wheel — the harness must measure the tree it
# is committed next to, or an increment's before/after is a diff of two different ostlers.
ostler = { workspace = true }

# One ruleset for every subproject — ruff is run from this root (`ruff check .`),
# so member packages deliberately carry no [tool.ruff] of their own.
[tool.ruff.lint]
# `extend-select` so ruff's defaults (E4/E7/E9/F) stay on.
extend-select = [
    "TID252",   # relative-imports
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "ANN401",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.flake8-tidy-imports]
# Every import names its package from the root: `from ostler.model import Graph`,
# never `from .model import Graph`. "all" also bans the single-dot sibling form,
# which the default ("parents") permits. A relative import only resolves when the
# module is imported as part of its package, and it hides which package a name
# comes from — see the python-cli skill.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# The one package that must NOT name itself. stablemate_core is not published — it is
# copied into workhorse and farrier by `make vendor`, so the same file is imported as
# `stablemate_core`, `farrier._vendor.stablemate_core` and
# `workhorse._vendor.stablemate_core`. An absolute self-import resolves to whichever copy
# is on sys.path, which in a checkout is the source one: a vendored module would reach
# back out of the wheel containing it, and the copies would stop being copies at runtime
# while still comparing byte-identical on disk. The glob is the package name rather than
# three paths, so a future consumer that vendors it is covered without an edit.
"**/stablemate_core/*.py" = ["TID252"]
"!{workflows/src/workhorse_workflows/okf_book/**,workflows/tests/okf_book/**}" = [
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "ANN401",
]

[tool.stablemate.strict]
paths = [
    "workflows/src/workhorse_workflows/okf_book",
    "workflows/tests/okf_book",
]
max-lines = 400

# ty runs from this root too (`make lint`), over the same tree ruff sees, so member
# packages carry no [tool.ty] of their own either. Every rule is at its default
# severity: there is no ignore list, because a rule that is off is a rule nobody can
# tell is being violated.
[tool.ty.src]
exclude = [
    # A *rendered reference*, not a module: the pre-Python-workflow snapshot that
    # `workflows/.../author/workflow.py` was written against and still cites. It imports
    # `author.gh_token` and calls helpers that the engine has since renamed, and that is
    # the point — it records the shape at the time it was written. Type-checking it
    # would report 28 findings whose only available fix is to edit the historical
    # record. Nothing imports it; it is prose that happens to be syntactically Python.
    "docs/plans/author-workflow-python/workflow.py",
]

# basedpyright — pyright's inference and its bundled third-party stubs, run from this
# root next to ruff and ty (`make lint`). It is a third opinion, not a replacement:
# ty follows this workspace's own calls and is fast; basedpyright sees through the
# libraries ty treats as opaque, and disagrees with it often enough to be worth the
# minute it costs.
#
# `typeCheckingMode = "standard"` is pyright's own default, deliberately not
# basedpyright's ("recommended", which turns every reportUnknown* on as an error and
# reports ~86k findings here — an annotation project, not a gate). Standard is the
# level whose findings are defects: an argument that cannot be assigned, a member on
# an Optional, a name possibly unbound. Ratcheting a single rule up from here is one
# line in [tool.basedpyright.reportX]; the mode is what makes the gate meaningful now.
[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
strict = [
    "workflows/src/workhorse_workflows/okf_book",
    "workflows/tests/okf_book",
]
# `include` is explicit rather than "the repo root", because the root also holds
# untracked working trees a checker must not walk: a member's stray .venv, the
# benchmark's materialized run directories. The excludes below are the same list
# [tool.ty.src] carries, for the reasons given there, plus the two trees whose
# contents are not this workspace's code.
include = [
    "core", "workhorse", "workflows", "farrier", "ostler", "groom", "saddlebag",
    "paddock", "stablemate", "scripts", "docs",
]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "docs/plans/author-workflow-python/workflow.py",
]

# A test module imports its own conftest and its `_fakes` siblings by bare name, the
# way pytest runs it — pytest puts the test directory on sys.path, and nothing else
# does. Same for the directory that is copied somewhere else to run: the QA harness
# lands on a project's PYTHONPATH as a flat directory of stdlib-only modules.
[[tool.basedpyright.executionEnvironments]]
root = "workflows/src/workhorse_workflows/okf_book"
extraPaths = ["workflows/src", "ostler", "workhorse"]
reportExplicitAny = "error"
reportAny = "error"

[[tool.basedpyright.executionEnvironments]]
root = "workflows/tests/okf_book"
extraPaths = ["workflows/tests", "workflows/src", "ostler", "workhorse"]
reportExplicitAny = "error"
reportAny = "error"

[[tool.basedpyright.executionEnvironments]]
root = "ostler/ostler/qa/harness"

[[tool.basedpyright.executionEnvironments]]
root = "core/tests"

[[tool.basedpyright.executionEnvironments]]
root = "farrier/tests"

[[tool.basedpyright.executionEnvironments]]
root = "groom/tests"

[[tool.basedpyright.executionEnvironments]]
root = "ostler/tests"

[[tool.basedpyright.executionEnvironments]]
root = "paddock/tests"

[[tool.basedpyright.executionEnvironments]]
root = "saddlebag/tests"

[[tool.basedpyright.executionEnvironments]]
root = "stablemate/tests"

[[tool.basedpyright.executionEnvironments]]
root = "scripts/tests"
extraPaths = ["scripts"]

[[tool.basedpyright.executionEnvironments]]
root = "workflows/tests"

[[tool.basedpyright.executionEnvironments]]
root = "workhorse/tests"

# The catch-all, last: pyright takes the first environment whose root contains the
# file, so the repo root has to come after every narrower one.
[[tool.basedpyright.executionEnvironments]]
root = "."
