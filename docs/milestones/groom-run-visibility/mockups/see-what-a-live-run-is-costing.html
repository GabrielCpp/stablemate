<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>groom mock: Live cost</title><style>/* groom — IDE console theme. Bespoke, dark-first, dense; no framework.
   Loaded after diff2html.min.css so diff panels pick up the dark scheme.
   Mirrors docs/services/groom-redesign/design-system.md. */

:root {
  --bg-0:#16181d; --bg-1:#1b1e24; --bg-2:#21252d; --bg-3:#2a2f39;
  --border:#2e333d; --border-2:#3a4150;
  /* text-2 is the dim tier — timestamps, ids, column heads, empty states. It was
     #6b7280, which is 3.7:1 on --bg-0 and worse on a selected row's --bg-3: below
     the 4.5:1 floor everywhere it appears. Lightened until it clears 4.5 against
     the *lightest* surface it lands on, and still reads dimmer than --text-1. */
  --text-0:#e6e8ec; --text-1:#a7adb8; --text-2:#94a3b8;
  --accent:#4c8bf5;
  /* White on --accent is 3.3:1. Near-black is 5.8:1 — and unlike white it gets
     *better* when :hover brightens the background. Same ink the badges use. */
  --on-accent:#0c0f14;
  /* --finished is a dot *and* the "done" liveness chip's ink; at #6b7280 the text
     side was 2.8:1 on a selected row. Neutral grey rather than --text-2's slate, so
     the two dim chips stay tellable apart. */
  --blocked:#f0483e; --blocked-ink:#f87171; --running:#38b26b; --idle:#c8873a; --finished:#9ca3af;
  /* diff2html colours its hunk headers from this variable — #6e7681 on its own
     info background is 3.7:1. Overriding the variable catches every diff2html
     surface at once, wherever the markup happens to be mounted. */
  --d2h-dark-dim-color:#94a3b8;
  --mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
* { box-sizing:border-box; }
html,body { height:100%; margin:0; }
body {
  font-family:var(--sans); font-size:13px; line-height:1.4;
  color:var(--text-0); background:var(--bg-0);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}

.app {
  display:grid; height:100vh;
  grid-template-columns:48px 1fr;
  grid-template-rows:1fr 24px;
  grid-template-areas:"act main" "status status";
}

/* keyboard users get a visible focus ring everywhere (a11y contract: never bare) */
:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }

/* Present to assistive tech, absent to the eye. `display:none` would drop it from
   the accessibility tree too, which is the opposite of the point. */
.sr-only { position:absolute; width:1px; height:1px; margin:-1px; padding:0;
  overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; border:0; }

/* ---- activity bar ---- */
#activitybar { grid-area:act; background:var(--bg-0); border-right:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; padding-top:6px; }
.act-btn { width:48px; height:44px; display:flex; align-items:center; justify-content:center;
  background:none; border:0; padding:0; font:inherit;
  color:var(--text-2); cursor:pointer; border-left:2px solid transparent; }
.act-btn:hover { color:var(--text-1); }
.act-btn.active { color:var(--text-0); border-left-color:var(--accent); }
.act-btn svg { width:20px; height:20px; }

/* ---- shared bits (filter box, empty/loading states) ---- */
.filter { background:var(--bg-2); border:1px solid var(--border); border-radius:4px;
  color:var(--text-0); font-size:12px; padding:4px 8px; outline:none; font-family:var(--sans); }
.filter:focus { border-color:var(--accent); }
.empty { color:var(--text-2); font-size:12px; padding:12px; }
.empty.loading { display:flex; align-items:center; gap:8px; }
.empty.loading .spin { width:12px; height:12px; border:2px solid var(--bg-3); border-top-color:var(--running); border-radius:50%; animation:spin .7s linear infinite; }

/* dots + badges */
.dot { width:8px; height:8px; border-radius:50%; flex:none; }
.dot.blocked { background:var(--blocked); animation:pulse 1.6s infinite; }
.dot.running { background:var(--running); }
.dot.idle { background:var(--idle); }
.dot.finished { background:var(--finished); }
@keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(240,72,62,.55)} 70%{box-shadow:0 0 0 5px rgba(240,72,62,0)} 100%{box-shadow:0 0 0 0 rgba(240,72,62,0)} }
@media (prefers-reduced-motion:reduce){ .dot.blocked{animation:none} }
.badge { font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.04em;
  padding:1px 5px; border-radius:3px; color:var(--on-accent); font-weight:600;
  background:hsl(var(--type-hue,210),45%,58%); }
.badge[data-type="coder"] { background:#2f9e8f; }
.badge[data-type="author"] { background:#8a6ff0; }

/* ---- main: one panel at a time (see mode visibility below) ---- */
#main { grid-area:main; position:relative; overflow:hidden; }
.pane { display:none; height:100%; overflow:hidden; }
#runs { border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
.pane-head { padding:6px 10px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px;
  font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-2); }
.pane-head .filter { margin-left:auto; text-transform:none; letter-spacing:0; max-width:160px; }
.runs-list { overflow-y:auto; flex:1; }
.row { padding:6px 10px; cursor:pointer; background:none; font:inherit; color:inherit;
  text-align:left; width:100%; border:0; border-bottom:1px solid var(--border);
  border-left:2px solid transparent; display:flex; flex-direction:column; gap:3px; }
.row:hover { background:var(--bg-2); }
.row.selected { background:var(--bg-3); border-left-color:var(--accent); }
.row.blocked { border-left-color:var(--blocked); }
.row .line1 { display:flex; align-items:center; gap:7px; min-width:0; }
.row .line2 { display:flex; align-items:baseline; gap:8px; min-width:0; }
/* A run id is now a whole name rather than a four-character fragment, so line1
   needs somewhere to give. The id is the half you paste, so it never shrinks;
   the repo label ellipsizes instead. */
.row .repo-branch { font-family:var(--mono); font-size:11.5px; color:var(--text-1);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.row .wid { font-family:var(--mono); font-size:11.5px; color:var(--text-2);
  white-space:nowrap; flex:none; }
.row .doing { font-family:var(--mono); font-size:10.5px; color:var(--text-2);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.row .mini { margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--text-2); white-space:nowrap; flex:none; }
.row .q { display:block; font-size:11.5px; color:var(--text-1); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* liveness chip: whether the process behind the row is still breathing.
   `unknown` is deliberately distinct from `dead` — nothing was ever observed. */
.pulse { margin-left:auto; font-family:var(--mono); font-size:9.5px; text-transform:uppercase;
  letter-spacing:.05em; padding:0 5px; border-radius:3px; border:1px solid var(--border-2);
  color:var(--text-2); white-space:nowrap; flex:none; }
.pulse.live { color:var(--running); border-color:var(--running); }
.pulse.dead { color:var(--blocked); border-color:var(--blocked); }
.pulse.done { color:var(--finished); }
.pulse.unknown { color:var(--text-2); }

/* ---- detail ---- */
#detail { display:flex; flex-direction:column; overflow:hidden; background:var(--bg-1); }
.detail-head { padding:8px 12px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.detail-head .repo-branch { font-family:var(--mono); font-size:12px; color:var(--text-0); }
.detail-head .meta { font-family:var(--mono); font-size:11px; color:var(--text-2); }
/* the full run id, shown whole so it can be copied: `user-select:all` makes one
   click take the entire string, and `break-all` lets a long id wrap in a narrow
   pane instead of pushing the head's chips off the edge */
.detail-head .run-id { font-family:var(--mono); font-size:11px; color:var(--text-1);
  cursor:text; user-select:all; -webkit-user-select:all; word-break:break-all; }
/* the activity line owns the full width under the head's chips */
.detail-head .doing-line { flex-basis:100%; font-family:var(--mono); font-size:11.5px; color:var(--text-1);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.detail-body { overflow-y:auto; padding:12px; flex:1; }
.no-gate { color:var(--text-2); font-size:12px; background:var(--bg-2); border:1px solid var(--border);
  border-radius:5px; padding:8px 12px; }
.no-gate code { font-family:var(--mono); color:var(--text-1); }
.gate-block { margin-bottom:18px; }
.gate-path { font-family:var(--mono); font-size:11px; color:var(--text-2); margin-bottom:8px; }
.question { background:var(--bg-2); border:1px solid var(--border); border-radius:5px; padding:10px 12px; }
.question :first-child { margin-top:0; } .question :last-child { margin-bottom:0; }
.question pre { background:var(--bg-0); border:1px solid var(--border); border-radius:4px; padding:8px 10px; overflow:auto; }
.question code { font-family:var(--mono); font-size:12px; }
.question a { color:var(--accent); }
.answer { margin-top:10px; }
.answer textarea { width:100%; min-height:88px; background:var(--bg-2); border:1px solid var(--border);
  border-radius:5px; color:var(--text-0); font-family:var(--sans); font-size:13px; padding:8px 10px; outline:none; resize:vertical; }
.answer textarea:focus { border-color:var(--accent); }
.answer-actions { margin-top:8px; display:flex; align-items:center; gap:8px; }
.btn { background:var(--accent); color:var(--on-accent); border:none; border-radius:4px; padding:5px 14px; font-size:12px; cursor:pointer; font-family:var(--sans); }
.btn:hover { filter:brightness(1.08); }
.btn.ghost { background:transparent; color:var(--text-1); border:1px solid var(--border-2); }
.disclosure { margin-top:14px; border-top:1px solid var(--border); padding-top:10px; }
.disclosure summary { cursor:pointer; color:var(--text-1); font-size:12px; list-style:none; }
.disclosure summary::-webkit-details-marker { display:none; }
.disclosure summary::before { content:"▸ "; color:var(--text-2); }
.disclosure[open] summary::before { content:"▾ "; }
.diff-wrap { margin-top:8px; font-size:12px; }
.detail-empty { color:var(--text-2); padding:24px 12px; text-align:center; }

/* ---- run detail: live sections (metrics + log trail), refreshed on a timer ---- */
.live-sec { margin-top:16px; }
.live-sec-head { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-2);
  border-bottom:1px solid var(--border); padding-bottom:4px; margin-bottom:8px; }
.metrics-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:6px; }
.metric { background:var(--bg-2); border:1px solid var(--border); border-radius:5px; padding:5px 9px;
  display:flex; flex-direction:column; gap:2px; min-width:0; }
.metric .m-k { font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--text-2); }
.metric .m-v { font-family:var(--mono); font-size:12.5px; color:var(--text-0);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.metric.bad .m-v { color:var(--blocked); }
.metrics-foot { margin-top:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  font-family:var(--mono); font-size:10.5px; color:var(--text-2); }
.metrics-foot code { font-family:var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.history-filter { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.history-filter select { width:auto; margin:0; padding:4px 8px; }
.history-filter { flex-wrap:wrap; }
.history-filter label { display:flex; align-items:center; gap:8px; }
.trail-views { display:inline-flex; gap:4px; }
.trail-views .btn { padding:3px 10px; }
.trail-views .btn[aria-pressed="true"] { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
.log-line.turn { display:block; font-family:var(--sans); }
.lt-turn-head { display:grid; grid-template-columns:112px 130px minmax(0, 1fr) auto auto; gap:8px; cursor:pointer; }
.lt-turn-head .lt-slug, .lt-turn-head .lt-status, .lt-turn-head .lt-dur { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lt-status.running { color:var(--accent); }
.log-line.bad .lt-status { color:var(--blocked); }
.lt-turn-body { display:flex; flex-direction:column; gap:8px; padding:8px 0 6px 12px; min-width:0; }
.lt-turn-body .at-tool-name { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.at-msg.thought { border-left-style:dashed; }
.at-msg.thought .at-text { color:var(--text-1); font-style:italic; }
.at-msg.plan { border-left-color:var(--idle); }
details.at-msg summary { cursor:pointer; }
.log-trail { background:var(--bg-0); border:1px solid var(--border); border-radius:5px;
  max-height:340px; overflow:auto; font-family:var(--mono); font-size:11.5px; }
.log-line { display:grid; grid-template-columns:112px 52px 130px minmax(0, 1fr); gap:8px; padding:2px 8px;
  border-bottom:1px solid var(--bg-2); color:var(--text-1); }
.log-line:last-child { border-bottom:0; }
.log-line .lt-ts, .log-line .lt-lvl, .log-line .lt-node { color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.log-line .lt-body { white-space:pre-wrap; overflow-wrap:anywhere; }
.log-line.warn .lt-lvl { color:var(--idle); }
.log-line.bad .lt-lvl, .log-line.bad .lt-body { color:var(--blocked); }
/* ---- attendant pane (the log of claudes groom sent at a stopped run) ---- */
#attend-list-panel { border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
.attend-list { overflow-y:auto; flex:1; }
.attend-row { display:flex; align-items:stretch; border-bottom:1px solid var(--border);
  border-left:2px solid transparent; }
.attend-row:hover { background:var(--bg-2); }
.attend-row.active { background:var(--bg-3); border-left-color:var(--accent); }
.attend-open { flex:1; min-width:0; padding:6px 10px; cursor:pointer; background:none; font:inherit;
  color:inherit; text-align:left; border:0; display:flex; flex-direction:column; gap:3px; }
.attend-open[disabled] { cursor:default; opacity:.7; }
.attend-open .line1 { display:flex; align-items:center; gap:7px; min-width:0; }
.attend-open .repo-branch { font-family:var(--mono); font-size:11.5px; color:var(--text-1);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.attend-open .wid { font-family:var(--mono); font-size:11.5px; color:var(--text-2); white-space:nowrap; flex:none; }
.attend-status { margin-left:auto; font-family:var(--mono); font-size:9.5px; text-transform:uppercase;
  letter-spacing:.05em; padding:0 5px; border-radius:3px; border:1px solid var(--border-2);
  color:var(--text-2); white-space:nowrap; flex:none; }
.attend-status.running { color:var(--running); border-color:var(--running); }
.attend-reason { font-size:11.5px; color:var(--text-1); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.attend-meta { font-family:var(--mono); font-size:10.5px; color:var(--text-2); }
.attend-stop { flex:none; align-self:center; margin-right:8px; background:transparent; color:var(--blocked-ink);
  border:1px solid var(--blocked); border-radius:4px; padding:3px 10px; font-size:11px;
  font-family:var(--sans); cursor:pointer; }
.attend-stop:hover { background:var(--blocked); color:var(--on-accent); }

#attend-detail { display:flex; flex-direction:column; overflow:hidden; background:var(--bg-1); }
.at-head { padding:8px 12px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:5px; flex:none; }
.at-head-line { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.at-head-line .repo-branch { font-family:var(--mono); font-size:12px; color:var(--text-0); }
.at-head-line .wid { font-family:var(--mono); font-size:11px; color:var(--text-2); }
.at-head-reason { font-size:12px; color:var(--text-1); }
.at-head-dir { font-family:var(--mono); font-size:10.5px; color:var(--text-2); word-break:break-all; }
/* the resume line exists to be pasted: one click takes the whole command */
.at-resume { font-family:var(--mono); font-size:11.5px; color:var(--text-0); background:var(--bg-0);
  border:1px solid var(--border); border-radius:4px; padding:5px 8px;
  user-select:all; -webkit-user-select:all; word-break:break-all; }
.at-attempts { font-family:var(--mono); font-size:10.5px; color:var(--text-2); display:flex;
  flex-wrap:wrap; gap:6px; }
.at-body { overflow-y:auto; flex:1; padding:12px; display:flex; flex-direction:column; gap:10px; }
.at-msg { display:flex; flex-direction:column; gap:3px; border-left:2px solid var(--border-2); padding-left:9px; }
.at-msg.user { border-left-color:var(--accent); }
.at-msg.sidechain { opacity:.85; }
.at-role { font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-2); }
.at-text { font-size:13px; color:var(--text-0); overflow-wrap:anywhere; }
.at-text :first-child { margin-top:0; } .at-text :last-child { margin-bottom:0; }
.at-text pre { background:var(--bg-0); border:1px solid var(--border); border-radius:4px;
  padding:8px 10px; overflow:auto; }
.at-text code { font-family:var(--mono); font-size:12px; }
.at-tool { background:var(--bg-2); border:1px solid var(--border); border-radius:4px; padding:4px 9px; }
.at-tool summary { cursor:pointer; list-style:none; }
.at-tool summary::-webkit-details-marker { display:none; }
.at-tool-head { display:flex; align-items:baseline; gap:8px; min-width:0; font-family:var(--mono); font-size:11px; }
.at-tool-head.failed .at-tool-name { color:var(--blocked); }
.at-tool-name { color:var(--text-1); flex:none; }
.at-tool-sum { color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.at-tool-body { margin:6px 0 2px; font-family:var(--mono); font-size:11px; color:var(--text-1);
  white-space:pre-wrap; overflow-wrap:anywhere; max-height:320px; overflow:auto; }
.at-divider { font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-2);
  border-top:1px solid var(--border); padding-top:8px; }
/* the link a blocked or dead run draws to whoever is working it */
.attend-link { display:flex; align-items:center; gap:7px; width:100%; margin-bottom:10px;
  background:var(--bg-2); border:1px solid var(--border-2); border-radius:5px; padding:6px 10px;
  color:var(--text-1); font-family:var(--sans); font-size:12px; text-align:left; cursor:pointer; }
.attend-link:hover { border-color:var(--accent); color:var(--text-0); }

/* ---- dispatch pane (config-declared work queues) ---- */
#dispatch-list-panel { border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
#btn-dispatch-new { margin-left:auto; }
#btn-dispatch-new:disabled { opacity:.5; cursor:default; }
#dispatch-queues { flex:none; max-height:40%; overflow-y:auto; border-bottom:1px solid var(--border); }
#dispatch-items { flex:1; overflow-y:auto; }
#dispatch-detail { display:flex; flex-direction:column; overflow:hidden; background:var(--bg-1); padding:10px; gap:10px; }
.dispatch-queue-row { border-bottom:1px solid var(--border); }
.dispatch-queue-open { width:100%; display:flex; align-items:center; gap:10px; padding:6px 10px;
  cursor:pointer; background:none; font:inherit; color:inherit; text-align:left; border:0;
  border-left:2px solid transparent; }
.dispatch-queue-open:hover { background:var(--bg-2); }
.dispatch-queue-open.active { background:var(--bg-3); border-left-color:var(--accent); }
.dispatch-item-row { display:flex; align-items:stretch; border-bottom:1px solid var(--border);
  border-left:2px solid transparent; }
.dispatch-item-open { flex:1; min-width:0; display:flex; align-items:center; gap:10px; padding:6px 10px;
  cursor:pointer; background:none; font:inherit; color:inherit; text-align:left; border:0; }
.dispatch-item-row:hover { background:var(--bg-2); }
.dispatch-item-row.active { background:var(--bg-3); border-left-color:var(--accent); }
.dispatch-detail-row { display:flex; gap:8px; font-size:12px; }
.dispatch-detail-label { color:var(--text-2); min-width:80px; }
.dispatch-enqueue { display:flex; flex-direction:column; gap:8px; padding:10px; }
.dispatch-field { display:flex; flex-direction:column; gap:4px; }
.dispatch-field-label { font-size:12px; color:var(--text-2); }
.dispatch-field input, .dispatch-field select { font:inherit; padding:4px 6px; }
.dispatch-enqueue-actions { display:flex; justify-content:flex-end; }

/* ---- dispatch "new run" dialog (same modal-overlay pattern as #palette) ---- */
#dispatch-enqueue-modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none;
  align-items:flex-start; justify-content:center; padding-top:12vh; z-index:50; }
#dispatch-enqueue-modal.open { display:flex; }
.dispatch-enqueue-box { width:min(420px,90vw); background:var(--bg-2); border:1px solid var(--border-2);
  border-radius:8px; box-shadow:0 12px 40px rgba(0,0,0,.5); overflow:hidden; }
.dispatch-enqueue-head { display:flex; align-items:center; gap:8px; padding:10px 12px;
  border-bottom:1px solid var(--border); font-size:13px; color:var(--text-0); }
.dispatch-enqueue-close { margin-left:auto; background:transparent; border:0; color:var(--text-2);
  font-size:14px; cursor:pointer; padding:2px 4px; }
.dispatch-enqueue-close:hover { color:var(--text-0); }

/* ---- settings ---- */
.settings-panel { padding:16px; max-width:640px; }
.settings-panel h2 { font-size:13px; margin:0 0 10px; }
.setting { background:var(--bg-1); border:1px solid var(--border); border-radius:5px; padding:12px 14px; }
.setting-loading { color:var(--text-2); font-size:12px; }
.setting-head { display:flex; align-items:center; gap:10px; }
.switch { display:flex; align-items:center; gap:8px; cursor:pointer; }
.switch input { accent-color:var(--accent); cursor:pointer; width:15px; height:15px; }
.switch-label { font-size:13px; color:var(--text-0); }
.setting-mode { margin-left:auto; font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
  letter-spacing:.05em; color:var(--text-2); }
.setting-why { margin:8px 0 0; font-size:12px; color:var(--text-1); }
.setting-why code { font-family:var(--mono); font-size:11.5px; color:var(--text-0); }
.setting-source { margin:6px 0 0; font-family:var(--mono); font-size:10.5px; color:var(--text-2); }

/* ---- container+repo picker bar (Files / Diff panels) ---- */
.picker-bar { padding:6px 10px; border-bottom:1px solid var(--border); flex:none; }
.repo-picker { display:inline-flex; align-items:center; gap:8px; max-width:100%;
  background:var(--bg-2); border:1px solid var(--border); border-radius:5px; cursor:pointer;
  color:var(--text-0); font-family:var(--mono); font-size:12px; padding:5px 10px; }
.repo-picker:hover { border-color:var(--border-2); }
.repo-picker .repo-picker-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.repo-picker .caret { color:var(--text-2); flex:none; }

/* ---- Zed-style repo menu (floating, positioned under the active picker) ---- */
#repo-menu-wrap { position:fixed; inset:0; display:none; z-index:55; }
#repo-menu-wrap.open { display:block; }
.repo-menu-box { position:absolute; width:max-content; max-width:min(560px,90vw);
  background:var(--bg-2); border:1px solid var(--border-2); border-radius:8px;
  box-shadow:0 12px 40px rgba(0,0,0,.5); overflow:hidden; }
.repo-menu-box #repo-search { width:100%; background:transparent; border:none;
  border-bottom:1px solid var(--border); color:var(--text-0); font-size:13px; padding:9px 12px;
  outline:none; font-family:var(--sans); }
#repo-menu { max-height:min(360px,60vh); overflow-y:auto; padding:4px 0; }
.repo-item { padding:6px 12px; display:flex; align-items:center; gap:8px; cursor:pointer;
  font-family:var(--mono); font-size:12px; color:var(--text-1); white-space:nowrap; }
/* .active is the keyboard cursor, the one the combobox's aria-activedescendant
   points at. Without a visible rule it moves silently and arrow-key users have
   no idea what Enter will pick — same treatment the palette's cursor gets. */
.repo-item:hover, .repo-item.active { background:var(--bg-3); }
.repo-item .repo-item-label { overflow:hidden; text-overflow:ellipsis; }
.repo-empty { color:var(--text-2); font-size:12px; padding:12px; }

/* ---- Files / Diff panels: file/changeset tree + viewer ---- */
.fd-split { flex:1 1 auto; display:grid; grid-template-columns:300px 1fr; min-height:0; overflow:hidden; }
.fd-tree { border-right:1px solid var(--border); overflow:auto; padding:6px 4px;
  font-family:var(--mono); font-size:12px; }
.fd-view { overflow:auto; min-width:0; background:var(--bg-1); display:flex; flex-direction:column; }
.fd-empty { color:var(--text-2); font-size:12px; padding:16px 12px; }
.file-head { padding:6px 12px; border-bottom:1px solid var(--border); flex:none;
  font-family:var(--mono); font-size:11.5px; color:var(--text-1);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.file-body { overflow:auto; flex:1 1 auto; }
.file-pre { margin:0; padding:10px 12px; font-family:var(--mono); font-size:12px; line-height:1.5;
  background:var(--bg-0); tab-size:4; }
.file-pre code { font-family:var(--mono); background:none; padding:0; }

/* file/changeset treeview (shared by Files + Diff panels) */
.tree-children { margin-left:12px; }
.tree-dir.collapsed > .tree-children { display:none; }
.tree-dir-head { display:flex; align-items:center; gap:4px; padding:2px 4px; color:var(--text-1); cursor:pointer; border-radius:3px; white-space:nowrap;
  background:none; border:0; font:inherit; width:100%; text-align:left; }
.tree-dir-head:hover { background:var(--bg-2); }
.tree-dir-head .tchev { color:var(--text-2); font-size:9px; width:9px; flex:none; transition:transform .1s; }
.tree-dir.collapsed > .tree-dir-head .tchev { transform:rotate(-90deg); }
.tree-file { display:flex; align-items:center; gap:8px; padding:2px 6px; cursor:pointer; border-radius:3px;
  background:none; border:0; font:inherit; color:inherit; width:100%; text-align:left; }
.tree-file:hover { background:var(--bg-2); }
.tree-file.active { background:var(--bg-2); box-shadow:inset 2px 0 0 var(--accent); }
.tree-file .fname { color:var(--text-0); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tree-file .fstat { flex:none; font-size:11px; }
.tree-file .fstat .add { color:#3fb950; } .tree-file .fstat .del { color:#f85149; }

/* diff2html renders its own table with its own per-cell layout; the bespoke
   theme is class-based so it never bleeds into those bare cells. */
.diff-wrap a { text-decoration:none; color:inherit; }

/* ---- mode visibility (activity bar): show one panel at a time ---- */
.app[data-mode="runs"]      #runs-pane      { display:grid; grid-template-columns:1.1fr 1.4fr; }
.app[data-mode="files"]     #files-pane     { display:flex; flex-direction:column; }
.app[data-mode="diff"]      #diff-pane      { display:flex; flex-direction:column; }
.app[data-mode="settings"]  #settings-pane  { display:block; overflow:auto; }
.app[data-mode="attend"]    #attend-pane    { display:grid; grid-template-columns:1.1fr 1.4fr; }
.app[data-mode="dispatch"]  #dispatch-pane  { display:grid; grid-template-columns:1.1fr 1.4fr; }

.alert-chip { font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.05em;
  padding:0 5px; border-radius:3px; border:1px solid var(--blocked); color:var(--blocked); }

/* ---- status bar ---- */
#statusbar { grid-area:status; background:var(--bg-1); border-top:1px solid var(--border);
  display:flex; align-items:center; gap:14px; padding:0 10px; font-size:11.5px; font-family:var(--mono); color:var(--text-1); overflow:hidden; }
.stat { display:flex; align-items:center; gap:5px; }
.stat .n { color:var(--text-0); }
.status-right { margin-left:auto; display:flex; align-items:center; gap:14px; color:var(--text-2); }
.ws-dot { width:7px; height:7px; border-radius:50%; background:var(--running); }
/* Connection chip. The dot is decoration; the word beside it is the accessible
   name, so a degraded socket is legible without relying on color. `stale` and
   `reconnecting` pulse because they are transient and self-healing; `offline` is
   flat red because it is not. */
.conn { gap:5px; }
.conn[data-conn="stale"] .ws-dot { background:var(--blocked); animation:conn-pulse 1.4s ease-in-out infinite; }
.conn[data-conn="reconnecting"] .ws-dot { background:var(--idle); animation:conn-pulse 1.4s ease-in-out infinite; }
.conn[data-conn="offline"] .ws-dot { background:var(--blocked); }
.conn[data-conn="stale"], .conn[data-conn="offline"] { color:var(--blocked); }
@keyframes conn-pulse { 50% { opacity:.25; } }
.kbd { font-family:var(--mono); font-size:10.5px; color:var(--text-2); border:1px solid var(--border-2); border-radius:3px; padding:0 4px; }
.statusbar-refresh { background:transparent; border:none; color:var(--text-2); cursor:pointer; font-size:13px; line-height:1; padding:2px 4px; border-radius:3px; }
.palette-open { background:none; border:0; font:inherit; color:var(--text-2); cursor:pointer;
  display:inline-flex; align-items:center; gap:4px; padding:2px 4px; border-radius:3px; }
.palette-open:hover { color:var(--text-0); background:var(--bg-3); }
.statusbar-refresh:hover { color:var(--text-0); background:var(--bg-3); }
.statusbar-refresh.spinning { animation:spin .7s linear infinite; color:var(--running); }
@keyframes spin { to { transform:rotate(360deg); } }

/* ---- command palette ---- */
#palette { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-start; justify-content:center; padding-top:12vh; z-index:50; }
#palette.open { display:flex; }
.palette-box { width:min(560px,90vw); background:var(--bg-2); border:1px solid var(--border-2); border-radius:8px; box-shadow:0 12px 40px rgba(0,0,0,.5); overflow:hidden; }
.palette-box input { width:100%; background:transparent; border:none; border-bottom:1px solid var(--border); color:var(--text-0); font-size:14px; padding:12px 14px; outline:none; font-family:var(--sans); }
.palette-results { max-height:320px; overflow-y:auto; }
.presult { padding:7px 14px; display:flex; align-items:center; gap:8px; cursor:pointer; font-size:12.5px; }
.presult:hover, .presult.active { background:var(--bg-3); }
.presult .rb { font-family:var(--mono); color:var(--text-1); }
.presult .hint { margin-left:auto; font-size:10.5px; color:var(--text-2); font-family:var(--mono); }

/* ---- toasts ---- */
#toasts { position:fixed; right:14px; bottom:34px; display:flex; flex-direction:column; gap:8px; z-index:60; }
.toast { background:var(--bg-2); border:1px solid var(--border-2); border-left:3px solid var(--blocked);
  border-radius:5px; padding:8px 12px; width:300px; box-shadow:0 8px 24px rgba(0,0,0,.4); animation:slidein .15s ease; }
.toast .t-title { font-size:12px; font-weight:600; margin-bottom:2px; }
.toast .t-body { font-size:11.5px; color:var(--text-1); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.toast.ok { border-left-color:var(--running); }
@keyframes slidein { from{transform:translateX(12px);opacity:0} to{transform:none;opacity:1} }

/* ---- exit-code hint (finished workers) ---- */
.exit-hint { font-family:var(--mono); font-size:10px; padding:0 5px; border-radius:3px; border:1px solid var(--border-2); }
.exit-hint.exit-ok { color:var(--running); }
.exit-hint.exit-err { color:var(--blocked); border-color:var(--blocked); }
body { display:flex; flex-direction:column; height:100vh; }
.mockbar { flex:none; display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:5px 10px; min-height:32px;
  background:repeating-linear-gradient(45deg,#2b2413,#2b2413 10px,#262011 10px,#262011 20px); border-bottom:1px dashed var(--idle);
  font-size:11px; color:#e8cf9f; font-family:var(--mono); }
.mockbar b { color:#f2dcae; font-weight:600; margin-right:4px; }
.mockbar button, .mockbar a { font:inherit; color:#e8cf9f; background:transparent; border:1px solid #6b5a33; border-radius:3px; padding:1px 7px; cursor:pointer; text-decoration:none; }
.mockbar button[aria-pressed="true"], .mockbar a.here { background:#e8cf9f; color:#1d1809; border-color:#e8cf9f; }
.mockbar .gap { width:14px; }
.mockbar .note { margin-left:auto; opacity:.85; }
.app { flex:1; height:auto; min-height:0; }
.app[data-mode="history"] #history-pane { display:grid; grid-template-columns:1fr; }
.app[data-mode="history"] #history-pane.has-sel { grid-template-columns:340px 1fr; }
.app[data-mode="runs"] #runs-pane.m { grid-template-columns:300px 1fr; }
.mono { font-family:var(--mono); }
.dim { color:var(--text-2); }
.num { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.chip { font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; padding:0 5px; border-radius:3px;
  border:1px solid var(--border-2); color:var(--text-2); white-space:nowrap; flex:none; }
.chip.ok { color:var(--running); border-color:var(--running); }
.chip.bad { color:var(--blocked-ink); border-color:var(--blocked); }
.chip.warn { color:var(--idle); border-color:var(--idle); }
.chip.solid { background:var(--bg-3); color:var(--text-1); }
.row .line3 { display:flex; gap:10px; font-family:var(--mono); font-size:10.5px; color:var(--text-1); }
.row .line3 .dim { color:var(--text-2); }
.dtabs { flex:none; display:flex; align-items:stretch; gap:2px; padding:0 8px; border-bottom:1px solid var(--border); background:var(--bg-1); }
.dtab { background:none; border:0; border-bottom:2px solid transparent; color:var(--text-2); font:inherit; font-size:12px; padding:7px 10px 5px; cursor:pointer; display:flex; align-items:center; gap:6px; }
.dtab:hover { color:var(--text-0); }
.dtab[aria-selected="true"] { color:var(--text-0); border-bottom-color:var(--accent); }
.dtab .cnt { font-family:var(--mono); font-size:10px; color:var(--text-2); }
.dtab .cnt .add { color:#3fb950; } .dtab .cnt .del { color:#f85149; }
.dtabs .right { margin-left:auto; display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:10.5px; color:var(--text-2); }
.gate-strip { flex:none; border-bottom:1px solid var(--border); border-left:3px solid var(--blocked); background:#2a1f22; padding:7px 12px; display:flex; flex-direction:column; gap:7px; }
.gate-line { display:flex; align-items:center; gap:10px; font-size:12.5px; min-width:0; }
.gate-line .gq { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1; }
.gate-strip .question { font-size:13px; }
.gate-strip textarea { width:100%; min-height:58px; background:var(--bg-2); border:1px solid var(--border-2); border-radius:5px; color:var(--text-0); font:inherit; padding:7px 9px; resize:vertical; }
.fill { flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
.fd-split { flex:1; }
.repo-mini { background:var(--bg-2); border:1px solid var(--border); border-radius:4px; color:var(--text-0); font-family:var(--mono); font-size:11px; padding:2px 8px; cursor:pointer; }
.side-state { margin:18px; padding:14px 16px; background:var(--bg-2); border:1px solid var(--border); border-left:3px solid var(--idle); border-radius:5px; max-width:560px; font-size:12.5px; color:var(--text-1); }
.side-state h3 { margin:0 0 6px; font-size:13px; color:var(--text-0); font-weight:600; }
.side-state .acts { margin-top:10px; display:flex; gap:8px; }
.diff-file { font-family:var(--mono); font-size:12px; }
.diff-head { padding:6px 12px; border-bottom:1px solid var(--border); display:flex; gap:10px; align-items:center; color:var(--text-1); font-size:11.5px; position:sticky; top:0; background:var(--bg-1); }
.diff-head .add { color:#3fb950; } .diff-head .del { color:#f85149; }
.dl { display:grid; grid-template-columns:44px 44px 1fr; line-height:1.55; }
.dl span { padding:0 8px; white-space:pre; }
.dl .ln { color:var(--text-2); text-align:right; user-select:none; }
.dl.hunk { background:#1d2a3d; color:var(--text-2); }
.dl.a { background:rgba(46,160,67,.14); } .dl.d { background:rgba(248,81,73,.13); }
.dl.a .tx { color:#aff5b4; } .dl.d .tx { color:#ffc9c5; }
.code { display:grid; grid-template-columns:44px 1fr; font-family:var(--mono); font-size:12px; line-height:1.55; background:var(--bg-0); }
.code span { padding:0 8px; white-space:pre; } .code .ln { color:var(--text-2); text-align:right; }
.k { color:#d2a8ff; } .s { color:#a5d6ff; } .c { color:var(--text-2); }
.ov { padding:12px; display:flex; flex-direction:column; gap:14px; overflow-y:auto; flex:1; min-height:0; }
.now { display:flex; flex-wrap:wrap; gap:0; background:var(--bg-2); border:1px solid var(--border); border-radius:5px; }
.now > div { padding:6px 12px; border-right:1px solid var(--border); display:flex; flex-direction:column; gap:1px; min-width:0; }
.now > div:last-child { border-right:0; }
.now .k2 { font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--text-2); }
.now .v2 { font-family:var(--mono); font-size:12.5px; }
.now .live-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--running); margin-right:5px; }
.kpis { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
.kpi { background:var(--bg-2); border:1px solid var(--border); border-radius:5px; padding:8px 11px; min-width:0; }
.kpi .kk { font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--text-2); display:flex; justify-content:space-between; gap:6px; }
.kpi .vv { font-family:var(--mono); font-size:19px; line-height:1.3; color:var(--text-0); }
.kpi .ss { font-size:11px; color:var(--text-1); line-height:1.35; }
.kpi .ss .warn { color:var(--idle); } .kpi .ss .bad { color:var(--blocked-ink); }
.sec-h { display:flex; align-items:center; gap:10px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-2); border-bottom:1px solid var(--border); padding-bottom:4px; margin-bottom:8px; }
.sec-h .aside { margin-left:auto; text-transform:none; letter-spacing:0; font-family:var(--mono); font-size:10.5px; }
.tbar { display:flex; height:16px; border-radius:3px; overflow:hidden; gap:1px; background:var(--bg-0); }
.tbar i { display:block; }
.seg-agent { background:var(--accent); } .seg-det { background:#8b9bb4; } .seg-infra { background:#5d6b80; } .seg-wait { background:var(--idle); } .seg-unc { background:repeating-linear-gradient(45deg,#3a4150,#3a4150 3px,#2a2f39 3px,#2a2f39 6px); }
.seg-gap { background:transparent; box-shadow:inset 0 0 0 1px var(--border-2); }
.legend { display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:7px; font-size:11.5px; color:var(--text-1); }
.legend span { display:flex; align-items:center; gap:6px; }
.legend i { width:10px; height:10px; border-radius:2px; display:inline-block; }
.legend b { font-family:var(--mono); font-weight:400; color:var(--text-0); }
.seg { display:inline-flex; border:1px solid var(--border-2); border-radius:4px; overflow:hidden; text-transform:none; letter-spacing:0; }
.seg button { background:transparent; border:0; color:var(--text-1); font:inherit; font-size:11.5px; padding:2px 10px; cursor:pointer; }
.seg button + button { border-left:1px solid var(--border-2); }
.seg button[aria-pressed="true"] { background:var(--bg-3); color:var(--text-0); }
table.tt { width:100%; border-collapse:collapse; font-size:12px; }
.tt th { text-align:right; font-weight:400; font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--text-2); padding:3px 8px; border-bottom:1px solid var(--border); white-space:nowrap; position:sticky; top:0; background:var(--bg-1); }
.tt th:first-child, .tt td:first-child { text-align:left; }
.tt td { padding:3px 8px; border-bottom:1px solid var(--bg-2); text-align:right; font-family:var(--mono); font-size:11.5px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.tt tr.flow > td { color:var(--text-0); }
.tt tr.sub > td { color:var(--text-1); }
.tt tr.step > td { color:var(--text-2); }
.tt tr.cur > td { background:rgba(56,178,107,.09); }
.tt tr.tog { cursor:pointer; } .tt tr.tog:hover > td { background:var(--bg-2); }
.tt .ch { display:inline-block; width:12px; color:var(--text-2); font-size:9px; }
.tt .barcell { width:150px; }
.tt .tb { display:flex; align-items:center; gap:8px; justify-content:flex-end; }
.tt .tb u { display:block; height:7px; background:var(--accent); opacity:.75; border-radius:1px; }
.tt .tb s { display:block; width:76px; flex:none; background:var(--bg-2); border-radius:1px; text-decoration:none; }
.tt .none { color:var(--text-2); }
.pair { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:18px; }
dl.facts { display:grid; grid-template-columns:max-content 1fr; gap:3px 12px; margin:0; font-size:12px; }
dl.facts dt { color:var(--text-2); }
dl.facts dd { margin:0; font-family:var(--mono); font-size:11.5px; color:var(--text-1); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.h-top { flex:none; display:flex; align-items:center; gap:10px; padding:6px 10px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.h-top select, .h-sel { background:var(--bg-2); border:1px solid var(--border); border-radius:4px; color:var(--text-0); font-size:12px; padding:3px 6px; font-family:var(--sans); }
.h-sum { flex:none; display:flex; gap:26px; padding:8px 12px; border-bottom:1px solid var(--border); background:var(--bg-1); font-size:11.5px; color:var(--text-1); }
.h-sum b { font-family:var(--mono); font-weight:400; font-size:14px; color:var(--text-0); display:block; }
.h-list { overflow:auto; flex:1; min-height:0; }
.h-col { display:flex; flex-direction:column; overflow:hidden; border-right:1px solid var(--border); min-height:0; }
table.ht { width:100%; border-collapse:collapse; }
.ht th { position:sticky; top:0; background:var(--bg-0); text-align:right; font-weight:400; font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--text-2); padding:5px 10px; border-bottom:1px solid var(--border-2); white-space:nowrap; }
.ht th.l, .ht td.l { text-align:left; }
.ht th.sorted { color:var(--text-0); }
.ht td { padding:6px 10px; border-bottom:1px solid var(--border); text-align:right; font-family:var(--mono); font-size:11.5px; color:var(--text-1); white-space:nowrap; font-variant-numeric:tabular-nums; }
.ht tbody tr { cursor:pointer; }
.ht tbody tr:hover td { background:var(--bg-2); }

  return `<div class="ov">${nowStrip(now)}${k}${bar}${breakdown(state !== 'ended')}<div class="pair">${models(unpriced ? [['gpt-5-codex', 104, null, '—', '—']] : blocked ? [['claude-sonnet-5', 35, 76.6, '2.2M', '93%'], ['claude-opus-5', 1, 7.5, '0.1M', '90%'], ['claude-haiku-5', 2, null, '—', '—']] : [['claude-sonnet-5', 94, 365.6, '11.2M', '94%'], ['claude-opus-5', 3, 46.7, '0.6M', '91%'], ['claude-haiku-5', 7, null, '—', '—']])}${facts([['Started', 'Oct 28 02:41'], ['Branch', 'story/sign-in-with-a-code'], ['Run dir', '/workspace/.agents/runs/coder-1'], ['Run id', state === 'blocked' ? 'billing-export' : 'checkout-rollout']])}</div>${sessions(blocked ? [['Nov 1 09:15', '7h 12m', 'still running', '<span class="dim">running</span>']] : [['Oct 28 02:41', '6h 14m', '11h', 'stopped by you'], ['Oct 28 19:40', '8h 02m', '2m', 'crashed: backend out of quota'], ['Oct 29 04:01', '26h 52m', '32h', 'machine restarted, no ending recorded'], ['Nov 1 12:34', '4h 12m', 'still running', '<span class="dim">running</span>']])}</div>`;
}

function render() {
  UI.view = state === 'blocked'
    ? { t: 432 / 4087, c: 84.1 / 677.67, total: 432, items: BLOCKED_ITEMS, outside: [0, 0], curChip: 'waiting on you 12m', curBad: true }
    : state === 'unpriced'
    ? { t: 2468 / 4087, c: null, total: 2468, items: LIVE_ITEMS.map((n) => [n[0], n[1], n[2], n[3], null, n[5]]), outside: [147, null] }
    : { t: 2468 / 4087, c: 412.3 / 677.67, total: 2468, items: LIVE_ITEMS, outside: [147, 24.1] };
  UI.endedBadge = state === 'ended';
  const ended = state === 'ended';
  const fresh = state === 'new';
  const id = state === 'blocked' ? 'billing-export' : 'checkout-rollout';
  const f = FLEET.find((r) => r.id === id);
  const head = runHead(ended ? { ...f, state: 'finished', live: 'done', label: 'ended', doingLine: 'failed at qa-story 2m ago' } : { ...f, doingLine: fresh ? 'preparing the story' : f.doing });
  const endedStrip = ended ? '<div class="ended-strip"><b>This run just ended: failed at qa-story.</b> It stays here until you leave it, then it lives in History. <a href="./review-a-finished-run-in-history.html">Open in History</a></div>' : '';
  const detail = `<div id="detail">${head}${state === 'blocked' ? gateStrip(false) : ''}${endedStrip}${tabs('overview', { sidecar: !ended, diffCount: fresh ? '' : '<span class="add">+66</span> <span class="del">−5</span>', problems: fresh ? 0 : state === 'blocked' ? 3 : 4 })}<div class="fill">${body()}</div></div>`;
  const page = `<div id="runs-pane" class="pane m">${fleet(id, ended ? { 'checkout-rollout': { state: 'finished', live: 'done', label: 'ended', doing: 'failed at qa-story', mini: '2m ago' } } : null)}${detail}</div>`;
  mount(mockbar('see-what-a-live-run-is-costing', STATES, state, 'same Overview as History, marked live') + shell('runs', page));
  document.querySelectorAll('[data-state]').forEach((b) => b.addEventListener('click', () => { state = b.dataset.state; render(); }));
}
renderPage = render;
render();
</script></body></html>
