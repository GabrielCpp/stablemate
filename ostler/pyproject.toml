[project]
name = "ostler"
version = "2.0.0"
description = "Define, validate, search and mutate a repository's markdown knowledge graph (OKF profile: epics, stories, seeds, knowledge, features)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Côté" }]
keywords = ["docs", "knowledge", "epics", "stories", "validation", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Utilities",
]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.0",
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
  "pydantic>=2.0",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-language-pack>=1.14",
  "unidiff>=0.7",
  # platformdirs and tomli-w are ostler._vendor.stablemate_core's requirements, not
  # ostler's own: the shared config file (whose [qa_tools.*] table the tool registry
  # reads), base-library discovery and the cache directory are vendored in rather than
  # depended on (see core/README.md), so their floors land here.
  "platformdirs>=4.0",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "playwright>=1.40", "pillow>=10.0"]
vet = ["playwright>=1.40", "pillow>=10.0"]
qa = ["playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/GabrielCpp/stablemate"
Repository = "https://github.com/GabrielCpp/stablemate"
Issues = "https://github.com/GabrielCpp/stablemate/issues"

[project.scripts]
ostler = "ostler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ostler"]

[tool.hatch.build.targets.sdist]
include = ["ostler", "README.md", "SPEC.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Discard a passing test's tmp_path immediately; keep it only for a failure. pytest's
# default (`all`) retains three whole runs' worth of sandboxes.
tmp_path_retention_policy = "failed"
# CPython's argparse lazily loads `gettext` on first use, which on this CPython
# build opens a socket to query locale data and never closes it (the socket is
# closed at interpreter shutdown — pytest's ResourceWarning fires before that).
# Nothing in user code can prevent the leak: `re.compile` reaches it through the
# `locale` → `socket.gethostname()` chain that argparse triggers. Filter the
# warning narrowly so a real leak elsewhere still surfaces — stdlib modules only,
# `ResourceWarning` only, never the broad class. Pytest wraps the resource leak in
# a PytestUnraisableExceptionWarning when it's reported at GC time, so filter both
# forms on the same modules.
filterwarnings = [
  "ignore::ResourceWarning:argparse",
  "ignore::ResourceWarning:gettext",
  "ignore::ResourceWarning:locale",
  "ignore::ResourceWarning:re",
  "ignore::ResourceWarning:shutil",
  "ignore::ResourceWarning:socket",
  "ignore::pytest.PytestUnraisableExceptionWarning:_pytest.unraisableexception",
]
