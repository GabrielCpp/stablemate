[project]
name = "ostler"
version = "2.0.0"
description = "Define, validate, search and mutate a repository's markdown knowledge graph (OKF profile: epics, stories, seeds, knowledge, features)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Côté" }]
keywords = ["docs", "knowledge", "epics", "stories", "validation", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Utilities",
]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.0",
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
  "pydantic>=2.0",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-language-pack>=1.14",
  "unidiff>=0.7",
  # platformdirs and tomli-w are ostler._vendor.stablemate_core's requirements, not
  # ostler's own: the shared config file (whose [qa_tools.*] table the tool registry
  # reads), base-library discovery and the cache directory are vendored in rather than
  # depended on (see core/README.md), so their floors land here.
  "platformdirs>=4.0",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "playwright>=1.40", "pillow>=10.0"]
vet = ["playwright>=1.40", "pillow>=10.0"]
qa = ["playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/GabrielCpp/stablemate"
Repository = "https://github.com/GabrielCpp/stablemate"
Issues = "https://github.com/GabrielCpp/stablemate/issues"

[project.scripts]
ostler = "ostler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ostler"]

[tool.hatch.build.targets.sdist]
include = ["ostler", "README.md", "SPEC.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Discard a passing test's tmp_path immediately; keep it only for a failure. pytest's
# default (`all`) retains three whole runs' worth of sandboxes.
tmp_path_retention_policy = "failed"
# A test suite that ships with warnings is a test suite with broken windows: the next
# person to add a test sees a warning they cannot interpret and assumes it is theirs,
# then learns to ignore the whole stream. Every warning is an error so a real one
# surfaces immediately.
#
# The single exception is the CPython stdlib socket leak. argparse lazily loads
# `gettext` on first use, which on this CPython build opens a socket to query
# locale data and never closes it (the socket is closed at interpreter shutdown —
# pytest's ResourceWarning fires before that). Nothing in ostler code can prevent
# it: `re.compile` reaches the leak through the `locale` → `socket.gethostname()`
# chain that argparse triggers, and the same socket is reachable from a
# `python -c "..."` subprocess that other tests spawn. Pytest wraps that leak in a
# `PytestUnraisableExceptionWarning` at GC time, so the ignore has to cover both
# classes. A real resource leak in ostler code (a subprocess.Popen that was never
# `wait()`-ed, a file opened without `with`) is caught by `error` above — the
# `ignore` filter only swallows the stdlib socket leak, never anything else.
filterwarnings = [
  "error",
  "ignore::ResourceWarning",
  "ignore::pytest.PytestUnraisableExceptionWarning",
]
