[check-skills]
skills = "base-library/library/skills"

[check-no-env]
package = "workflows/src/workhorse_workflows"

[check-no-env.allow]
"kit/leased_env.py" = """
writes the process environment for the length of one block: a QA lease's variables, which the \
plan's own commands read, and which are restored on exit. The values are leased for the run, \
never a token and never a checkpointed --param"""

"coder/shared/clones.py" = """
hands the clone-check script its cache directory through STABLEMATE_CACHE_DIR, the only way the \
script takes one, on top of a copy of the inherited environment its git calls need. The value is \
a cache path, never a secret"""

[[check-clones.coincidence]]
files = ["services/workflows/model/files.py", "services/farrier/model/files.py"]
reasons = [
  "the workflows book model records the files a sandbox holds and cites the scaffold and pyflow run it mirrors, so it changes with the workflows watch list",
  "the farrier book model records the files a repository holds and cites the outputs writer it mirrors, so it changes with farrier's watch list",
]

[[check-clones.coincidence]]
files = ["services/workflows/model/state.py", "services/farrier/model/state.py"]
reasons = [
  "the workflows state is a workspace whose stages follow the scaffold and skill install of a workflows directory",
  "the farrier state is a repository whose stages follow farrier's install and selection of agents.yml",
]

[[check-clones.coincidence]]
files = ["services/workhorse/model/files.py", "services/farrier/model/files.py"]
reasons = ["the workhorse book's model of a run's files and the strings the watch finds in them", "the farrier book's model of an installed repository's files and the strings the watch finds in them"]

[[check-clones.coincidence]]
files = ["services/workhorse/model/state.py", "services/farrier/model/state.py"]
reasons = ["the workhorse book's state of the runs directory, which grows with each run", "the farrier book's state of one repository, which grows with each install step"]
