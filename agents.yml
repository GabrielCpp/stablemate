agents:
  claude: true
  codex: false
  copilot: false

packs:
  - python-workflow
  - stablemate
  - testing
  - architecture
  - ui

# groom's web UI owes the accessibility contract, so select the universal skill
# directly (only this repo needs it; packs are for bundles reused by ≥2 repos).
#
# `stacks/python/python-htmx-accessibility` is deliberately no longer selected
# here: groom's dashboard does not use HTMX any more. The server sends JSON and
# the browser renders it with Preact islands, so that skill's mechanics -- focus
# across `hx-swap`, aria-live for out-of-band pushes, HTMX attributes on real
# controls -- describe machinery this repo does not have, and an agent that
# loads it will confidently rebuild it. The skill is not wrong; it is just for a
# stack we left. groom's own stack mechanics live in `stablemate-groom` instead.
#
# It still installs regardless, because `ui/ui-accessibility` routes to it via
# `instruction_file()` and farrier follows that as a dependency edge. Dropping it
# for real means changing that router line in the shared agent library, which is
# not this repo's call to make unilaterally -- so `stablemate-groom` says
# out loud that the stack skill does not apply here.
# `stablemate/repo-docs` governs this repo's prose entry surface --
# CLAUDE.md, README.md, and the per-package docs/ folders. Selected directly
# rather than through the `stablemate` pack because it is generic to any repo,
# not part of the stablemate toolchain bundle; promote it to a pack once a
# second repo wants it.
#
# `stablemate/stablemate-repo` is this repo's own root rules. It is selected here
# rather than in the `stablemate` pack because no other repo wants it — the pack
# ships the toolchain skills, not stablemate's house rules.
skills:
  - stablemate/stablemate-repo

# Direct single-item selection (no pack — see agents/packs/CLAUDE.md): the
# /update-skill-from-conversation command that folds a session's learnings back
# into the agent library (skills, commands, root instructions).
prompts:
  - agent-library/update-skill-from-conversation

# The root AGENTS.md is generated, not hand-written: house rules first, then the
# one procedure every change lands under. It is a library prompt, so the text is
# written once and every repo that wants it always-loaded aggregates the same file
# instead of maintaining its own copy of the cadence.
#
# Only `commit` is aggregated. `reload-runs` is a branch the commit procedure names
# — a live run holding the code you just fixed — and inlining a branch most turns
# never take spends every turn's context on it. It stays a `/stablemate-*` command,
# reachable by name and by path under `.claude/commands/`.
#
# The aggregated text lands in AGENTS.md — the name every harness reads — and
# CLAUDE.md is generated beside it as the `@AGENTS.md` pointer. `includeReadme:
# false` keeps the root README (an outward-facing overview) out of every
# session's context.
localInstructions:
  - skills:
      - stablemate-repo
    prompts:
      - stablemate-commit
    paths:
      - "."
    includeReadme: false
