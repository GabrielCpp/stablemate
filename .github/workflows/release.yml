# The only release path. Two triggers, and deliberately not `push: main` —
# a release is something you ask for (`make release`) and then approve (merge the PR),
# not something that happens because a commit landed.
#
#   workflow_dispatch          `make release`. release-please reads the commits since each
#                              package's last tag and opens/refreshes ONE release PR.
#   pull_request: closed       that PR merging. release-please then creates the tags and
#                              GitHub releases, and the publish job uploads to PyPI.
#
# Credentials: there are none. Publishing uses PyPI Trusted Publishing (OIDC) — the
# `id-token: write` permission below mints a short-lived token PyPI verifies against a
# publisher registered as (GabrielCpp, stablemate, release.yml, environment `pypi`).
# That registration pins THIS FILENAME, which is why the release PR and the upload live
# in one file rather than two.
#
# Publishing also has to be in the same *run* as the release: releases created with
# GITHUB_TOKEN do not trigger further workflows, so an `on: release` workflow would never
# fire. The publish job consumes this run's `releases_created` / `paths_released` outputs
# instead.

name: release

on:
  workflow_dispatch:
    inputs:
      force_publish:
        description: >-
          Upload the versions currently in the manifest even though release-please
          has nothing new to release. For the case where a release was tagged but
          the upload did not happen — a failed gate, an expired token, a cancelled
          run. Without this there is no way back: release-please reports
          releases_created=false once the tag exists, so publish can never run again
          for that version.
        type: boolean
        default: false
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # On a dispatch, always. On a merge, only for release-please's own branch — an
    # ordinary PR merging must not start a release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release-please--'))
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      paths_released: ${{ steps.rp.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          target-branch: main
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # uv.lock records every workspace member's own version, so release-please's bump
      # stales it the moment it writes the pyprojects. Refreshing it here means the PR a
      # human reviews is a tree that `uv sync --locked` accepts, rather than one that
      # fails on the next clone.
      - uses: actions/checkout@v4
        if: steps.rp.outputs.pr
        with:
          ref: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}
      - uses: astral-sh/setup-uv@v5
        if: steps.rp.outputs.pr
        with:
          python-version: "3.12"
      - name: Refresh uv.lock on the release branch
        if: steps.rp.outputs.pr
        run: |
          uv lock
          if ! git diff --quiet uv.lock; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh uv.lock for the release" uv.lock
            git push
          fi

  # The gate. An upload to PyPI cannot be taken back, so the suite that guards the repo's
  # invariants — lint, the package suites, check-public, check-no-env, check-parsers — runs
  # against the merged tree before anything leaves the runner.
  verify:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true' || inputs.force_publish
    runs-on: ubuntu-latest
    # Same bound as ci.yml's, and for the same reason: a wedged suite must not hold a
    # runner for six hours. Here it also keeps a release from hanging rather than failing.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # --locked to match ci.yml: the one gate whose failure is irreversible (an
      # upload cannot be un-published) must not silently re-resolve to a tree
      # nobody reviewed.
      - run: uv sync --all-packages --locked
      # The browser binary installs separately from the `playwright` package, and
      # ostler's live CDP scan test launches one. Without this the package imports
      # fine, the test gets past its `importorskip`, and it fails at launch —
      # blocking a release on a browser nobody had told CI to download.
      # chromium only: it is the one browser any test here drives.
      - run: uv run playwright install --with-deps chromium
      - run: make test

  publish:
    needs: [release-please, verify]
    if: needs.release-please.outputs.releases_created == 'true' || inputs.force_publish
    runs-on: ubuntu-latest
    # Named so PyPI's trusted publisher can require it, and so an optional required
    # reviewer here turns "merge the PR" into "approve the upload".
    environment: pypi
    permissions:
      id-token: write
    env:
      # Which packages this run uploads. Normally exactly what release-please just
      # released; under force_publish it is every package, because release-please
      # reports an empty set once the tags exist and each step below filters on this
      # list. Whatever is already on PyPI at its current version is skipped, so a
      # forced run is safe to repeat after a partial upload.
      RELEASED: >-
        ${{ needs.release-please.outputs.releases_created == 'true'
            && needs.release-please.outputs.paths_released
            || '["ostler","workhorse","farrier","workflows"]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # main, not the pull_request merge ref: this is the commit release-please tagged.
          ref: main
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Build every candidate before publishing any of them. The wheel smoke test then
      # installs workhorse-workflows against those local candidates, without uv's
      # workspace sources. That is the only way to exercise sibling version constraints:
      # uv.lock deliberately records editable members without their declared specifiers.
      # Uploads remain dependency-ordered below the smoke test.
      #
      # stablemate-core is absent deliberately: it is not a distribution. workhorse and
      # farrier each carry a copy of it (`make vendor`), so a core change is committed as
      # a change to both of their trees and releases through them.

      - name: Build ostler
        if: contains(fromJSON(env.RELEASED), 'ostler')
        run: uv build --package ostler --out-dir dist/ostler

      - name: Build workhorse-agent
        if: contains(fromJSON(env.RELEASED), 'workhorse')
        run: uv build --package workhorse-agent --out-dir dist/workhorse-agent

      - name: Build farrier
        if: contains(fromJSON(env.RELEASED), 'farrier')
        run: uv build --package farrier --out-dir dist/farrier

      - name: Build workhorse-workflows
        if: contains(fromJSON(env.RELEASED), 'workflows')
        run: uv build --package workhorse-workflows --out-dir dist/workhorse-workflows

      - name: Verify candidate dependency metadata
        if: contains(fromJSON(env.RELEASED), 'workflows')
        run: |
          links=()
          for directory in dist/ostler dist/workhorse-agent; do
            if [[ -d "$directory" ]]; then
              links+=(--find-links "$directory")
            fi
          done
          uv venv /tmp/workhorse-workflows-release
          uv pip install \
            --python /tmp/workhorse-workflows-release/bin/python \
            "${links[@]}" \
            dist/workhorse-workflows/*.whl
          uv pip check --python /tmp/workhorse-workflows-release/bin/python
          /tmp/workhorse-workflows-release/bin/workhorse-hello-world run --dry-run
          /tmp/workhorse-workflows-release/bin/workhorse-author dot >/dev/null

      # Publish only after every candidate is known to resolve, in dependency order.
      - name: Publish ostler
        if: contains(fromJSON(env.RELEASED), 'ostler')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: dist/ostler

      - name: Publish workhorse-agent
        if: contains(fromJSON(env.RELEASED), 'workhorse')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: dist/workhorse-agent

      - name: Publish farrier
        if: contains(fromJSON(env.RELEASED), 'farrier')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: dist/farrier

      - name: Publish workhorse-workflows
        if: contains(fromJSON(env.RELEASED), 'workflows')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: dist/workhorse-workflows

      # groom and saddlebag are versioned and get changelogs, but have no publish step:
      # the name `groom` on PyPI belongs to an unrelated project, and saddlebag is not
      # in scope. Releasing either means adding its steps here and registering a pending
      # trusted publisher first.
