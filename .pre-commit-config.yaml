# What runs before a commit lands here.
#
# `repo: local` for both guards rather than a hooks repository: each is a standalone
# script under `.githooks/` that reads the index itself, and staying runnable by hand
# matters most exactly when someone is working out why their commit was blocked.
# `language: system` because both are already satisfied by the workspace venv this
# repo's `make install` builds — pre-commit is the wiring, not a second environment.
#
# `pass_filenames: false` on the private-names guard is deliberate: it sweeps the whole
# tracked tree, not the staged diff, because a name that landed while the hook was
# uninstalled would otherwise stay in the tree forever. See the script's own header.
#
# Install with `make hooks`. Farrier owns the fenced region below and nothing else in
# this file; edit around it freely, and see agents.yml for how it is configured.
repos:
  - repo: local
    hooks:
      - id: private-names
        name: block private overlay names
        entry: .githooks/pre-commit
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: conventional-commit
        name: enforce Conventional Commits on the subject
        entry: .githooks/commit-msg
        language: system
        stages: [commit-msg]
# >>> farrier: hooks (generated) >>>
  - repo: local
    hooks:
      - id: farrier-hooks
        name: farrier generated-file gate and skill hooks
        entry: make farrier-run-hook
        language: system
        pass_filenames: false
        stages: [pre-commit]
# <<< farrier: hooks <<<
